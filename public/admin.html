<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1B434D">
<title>SheSell Console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%239EB83B'/%3E%3Cpath d='M11.5 15h17l-2.2 15.5H13.7z' fill='%231B434D'/%3E%3Cpath d='M15.5 15c0-5.6 9-5.6 9 0' fill='none' stroke='%231B434D' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&family=Noto+Serif:wght@600;700&family=Noto+Serif+Devanagari:wght@600;700&display=swap" rel="stylesheet">
<style>/* SheSell Console: same brand system as the storefront (deep teal, lime, soft sage),
   tuned for dense, scannable admin work. Mobile: sidebar slides in, tables become cards. */
:root {
  --teal: #1B434D; --teal-900: #0F2A31; --teal-700: #24545F; --teal-500: #3B6B76; --teal-300: #8FB0B6; --teal-100: #E2EBEA; --teal-50: #EFF4F3;
  --lime: #9EB83B; --lime-700: #5F7518; --lime-200: #D6E59D; --lime-100: #EDF3D5; --lime-50: #F7FAEC;
  --sage: #F4F7EE; --sage-200: #E6ECDA; --line: #DCE4D1; --line-2: #C9D4BD;
  --ink: #17282D; --ink-2: #44575C; --muted: #64767A;
  --warn-bg: #FFF4DF; --warn: #6E4306; --bad-bg: #F8DDDB; --bad: #8A1C15; --wa: #25D366;
  --sans: 'Mukta', 'Noto Sans Devanagari', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --display: 'Noto Serif', 'Noto Serif Devanagari', Georgia, serif;
  --r: 14px; --r-lg: 20px;
  --sh: 0 1px 2px rgba(15, 42, 49, .06), 0 6px 18px rgba(15, 42, 49, .06);
  --sh-lg: 0 18px 50px rgba(15, 42, 49, .22);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--sage); color: var(--ink); font: 15.5px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--teal-700); }
:focus-visible { outline: 3px solid var(--lime); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
svg { flex: none; }
.h1 { font-family: var(--display); font-size: clamp(24px, 2.6vw, 32px); line-height: 1.15; margin: 0; color: var(--teal-900); letter-spacing: -.01em; }
.h2 { font-family: var(--display); font-size: 18px; line-height: 1.25; margin: 0; color: var(--teal-900); }
.muted { color: var(--muted); }
.small, small { font-size: 13.5px; }
code, .mono { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 13px; }
.brand-mark { width: 38px; height: 38px; }

/* ---------- buttons, inputs ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 16px; border-radius: 12px; border: 1.5px solid transparent; font-weight: 700; font-size: 15px; text-decoration: none; white-space: nowrap; transition: background .15s, border-color .15s; }
.btn svg { width: 18px; height: 18px; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn.teal { background: var(--teal); color: #fff; }
.btn.teal:hover { background: var(--teal-700); }
.btn.ghost { background: #fff; color: var(--teal); border-color: var(--line-2); }
.btn.ghost:hover { border-color: var(--teal-300); background: var(--teal-50); }
.btn.danger { background: #B3261E; color: #fff; }
.btn.danger-ghost { background: #fff; color: var(--bad); border-color: #EBC2BE; }
.btn.danger-ghost:hover { background: var(--bad-bg); }
.btn.wa { background: var(--wa); color: #06281A; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--teal-700); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.icon-btn { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; border: 1.5px solid var(--line-2); background: #fff; color: var(--teal-700); text-decoration: none; }
.icon-btn:hover { background: var(--teal-50); border-color: var(--teal-300); }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn.wa-ic { color: #128C4A; }
.input { width: 100%; min-height: 42px; padding: 8px 12px; border-radius: 11px; border: 1.5px solid var(--line-2); background: #fff; font-size: 15.5px; }
textarea.input { resize: vertical; line-height: 1.45; }
.input:focus { outline: none; border-color: var(--teal-500); box-shadow: 0 0 0 3px rgba(158, 184, 59, .35); }
.field { display: grid; gap: 5px; align-content: start; }
.label { font-weight: 700; font-size: 13.5px; color: var(--ink-2); }
.hint { color: var(--muted); font-size: 12.5px; }
.form { display: grid; gap: 14px; }
.grid-f { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn-row.end { justify-content: flex-end; align-self: end; }
.btn-col { display: grid; gap: 10px; justify-items: start; }
.form-err { margin: 0; color: var(--bad); background: var(--bad-bg); border-radius: 10px; padding: 8px 12px; font-weight: 600; font-size: 14px; }
.switch { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--teal-900); cursor: pointer; }
.switch input { appearance: none; width: 44px; height: 26px; border-radius: 13px; background: var(--line-2); position: relative; transition: background .15s; flex: none; margin: 0; }
.switch input::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .15s; }
.switch input:checked { background: var(--lime); }
.switch input:checked::after { transform: translateX(18px); }
.search { position: relative; display: block; min-width: 220px; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
.search .input { padding-left: 38px; }
.lang { display: inline-flex; background: rgba(255, 255, 255, .1); border-radius: 10px; padding: 3px; gap: 2px; }
.lang button { border: 0; background: none; color: inherit; padding: 4px 10px; border-radius: 8px; font-weight: 700; font-size: 13.5px; }
.lang button[aria-pressed="true"] { background: #fff; color: var(--teal-900); }

/* ---------- pills ---------- */
.spill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 700; white-space: nowrap; background: var(--teal-50); color: var(--teal-700); }
.spill svg { width: 13px; height: 13px; }
.st-confirmed { background: #FFF1D6; color: #7A4B07; }
.st-packed { background: var(--teal-100); color: var(--teal-700); }
.st-out { background: #DCEDEA; color: #1F5F5A; }
.st-delivered { background: var(--lime-100); color: var(--lime-700); }
.st-cancelled { background: var(--bad-bg); color: var(--bad); }
.pay-pending { background: #FFF1D6; color: #7A4B07; }
.pay-claimed { background: #E3ECFA; color: #1F4B8F; }
.pay-paid { background: var(--lime-100); color: var(--lime-700); }
.pay-refunded { background: var(--sage-200); color: var(--ink-2); }
.pr-active { background: var(--lime-100); color: var(--lime-700); }
.pr-pending { background: #FFF1D6; color: #7A4B07; }
.pr-hidden { background: var(--sage-200); color: var(--ink-2); }
.pr-rejected { background: var(--bad-bg); color: var(--bad); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- login ---------- */
.login { min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; background: radial-gradient(1200px 500px at 10% -10%, var(--lime-100), transparent 60%), var(--sage); }
.login-card { width: min(440px, 100%); background: #fff; border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--sh-lg); padding: 28px 26px; display: grid; gap: 14px; }
.brand-row { display: flex; align-items: center; gap: 12px; }
.brand-row b { display: block; font-family: var(--display); font-size: 19px; color: var(--teal-900); }
.brand-row small { color: var(--muted); }
.login-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.login-foot .lang { background: var(--sage); color: var(--ink-2); }
.login-foot a { display: inline-flex; gap: 6px; align-items: center; font-weight: 700; text-decoration: none; }
.login-foot a svg { width: 16px; height: 16px; }
.code { background: var(--teal-900); color: var(--lime-200); padding: 10px 14px; border-radius: 10px; margin: 0; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100dvh; }
.side { position: sticky; top: 0; height: 100dvh; background: var(--teal); color: #fff; display: flex; flex-direction: column; padding: 18px 14px; gap: 18px; overflow-y: auto; z-index: 30; }
.brand { display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; padding: 0 6px; }
.brand b { display: block; font-family: var(--display); font-size: 19px; line-height: 1.1; }
.brand small { color: var(--lime-200); font-size: 13px; }
.nav { display: grid; gap: 3px; }
.nav-item { display: flex; align-items: center; gap: 11px; min-height: 44px; padding: 0 12px; border: 0; border-radius: 12px; background: none; color: rgba(255, 255, 255, .86); font-weight: 600; text-align: left; }
.nav-item svg { width: 19px; height: 19px; opacity: .9; }
.nav-item:hover { background: rgba(255, 255, 255, .09); color: #fff; }
.nav-item[aria-current="page"] { background: var(--lime); color: var(--teal-900); }
.nbadge { margin-left: auto; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 11px; background: #fff; color: var(--teal-900); font-size: 12.5px; font-weight: 800; display: grid; place-items: center; }
.nav-item[aria-current="page"] .nbadge { background: var(--teal); color: #fff; }
.side-foot { margin-top: auto; display: grid; gap: 12px; border-top: 1px solid rgba(255, 255, 255, .12); padding-top: 14px; }
.who { display: flex; align-items: center; gap: 10px; }
.who-t { display: grid; line-height: 1.25; min-width: 0; }
.who-t b { font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who-t small { color: var(--lime-200); font-size: 12.5px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--lime); color: var(--teal-900); font-weight: 800; font-size: 14px; flex: none; }
.avatar.shg { background: #74BDBA; }
.avatar.individual { background: #F3C77A; }
.side-links { display: flex; gap: 8px; flex-wrap: wrap; }
.side-links a, .side-links button { display: inline-flex; align-items: center; gap: 6px; border: 1px solid rgba(255, 255, 255, .22); background: none; color: #fff; padding: 6px 10px; border-radius: 10px; font-size: 13.5px; font-weight: 600; text-decoration: none; }
.side-links svg { width: 16px; height: 16px; }
.side-links a:hover, .side-links button:hover { background: rgba(255, 255, 255, .1); }
.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 10px 26px; background: rgba(244, 247, 238, .92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top-title { font-weight: 800; color: var(--teal-900); }
.menu-btn { display: none; }
.live-dot { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; color: var(--muted); }
.live-dot i { width: 9px; height: 9px; border-radius: 50%; background: var(--line-2); }
.live-dot.on { color: var(--teal-700); }
.live-dot.on i { background: #2FA84F; box-shadow: 0 0 0 4px rgba(47, 168, 79, .16); }
.view { padding: 22px 26px 60px; display: grid; gap: 18px; align-content: start; max-width: 1280px; width: 100%; }
@media (max-width: 960px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; left: 0; top: 0; bottom: 0; width: 270px; transform: translateX(-105%); transition: transform .2s ease; box-shadow: var(--sh-lg); }
  .side.open { transform: none; }
  .menu-btn { display: inline-grid; }
  .top { padding: 8px 14px; }
  .view { padding: 16px 14px 60px; }
}

/* ---------- page parts ---------- */
.page-head { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: flex-end; justify-content: space-between; }
.page-head p { margin: 4px 0 0; }
.head-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.card { background: #fff; border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; box-shadow: var(--sh); display: grid; gap: 12px; align-content: start; min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.grid2 { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); align-items: start; }
.stack { display: grid; gap: 18px; align-content: start; }
.note { display: flex; gap: 10px; align-items: flex-start; margin: 0; padding: 10px 14px; border-radius: 12px; background: var(--teal-50); color: var(--teal-900); font-size: 14.5px; }
.note svg { width: 19px; height: 19px; margin-top: 2px; color: var(--teal-500); }
.note.warn { background: var(--warn-bg); color: var(--warn); }
.note.warn svg { color: #B4730C; }
.note ul { margin: 4px 0 0; padding-left: 18px; }
.empty { display: grid; justify-items: center; gap: 8px; padding: 26px 12px; color: var(--muted); text-align: center; }
.empty svg { width: 28px; height: 28px; color: var(--teal-300); }
.empty p { margin: 0; }
.skel { display: grid; gap: 10px; }
.skel i { display: block; height: 56px; border-radius: 14px; background: linear-gradient(90deg, #fff, var(--sage-200), #fff); background-size: 200% 100%; animation: sh 1.2s linear infinite; }
@keyframes sh { to { background-position: -200% 0; } }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 13px; border-radius: 999px; border: 1.5px solid var(--line-2); background: #fff; color: var(--ink-2); font-weight: 600; font-size: 14px; white-space: nowrap; }
.chip:hover { border-color: var(--teal-300); }
.chip[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: #fff; }
.chip .cnt { font-size: 12px; font-weight: 800; padding: 0 6px; border-radius: 9px; background: var(--sage-200); color: var(--teal-900); }
.chip[aria-pressed="true"] .cnt { background: var(--lime); }

/* ---------- KPIs ---------- */
.kpis { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 700px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1250px) { .kpis[data-n="5"] { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
@media (min-width: 1300px) { .kpis[data-n="6"] { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.kpi { display: grid; grid-template-columns: auto 1fr; grid-template-areas: "i l" "v v" "s s"; gap: 2px 8px; align-items: center; text-align: left; padding: 14px 16px; border-radius: 16px; background: #fff; border: 1px solid var(--line); box-shadow: var(--sh); color: inherit; }
button.kpi:hover { border-color: var(--teal-300); }
.kpi svg { grid-area: i; width: 18px; height: 18px; color: var(--teal-500); }
.kl { grid-area: l; font-size: 13.5px; font-weight: 700; color: var(--ink-2); }
.kpv { grid-area: v; font-size: 28px; font-weight: 800; color: var(--teal-900); line-height: 1.15; font-variant-numeric: tabular-nums; }
.kpi small { grid-area: s; color: var(--muted); font-size: 12.5px; }
.kpi small.up { color: var(--lime-700); font-weight: 700; }
.kpi small.down { color: #A2451C; font-weight: 700; }

/* ---------- charts ---------- */
.chart { position: relative; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .gl { stroke: var(--sage-200); stroke-width: 1; }
.chart .axis { stroke: var(--line-2); stroke-width: 1; }
.chart .yl { fill: var(--muted); font-size: 11.5px; text-anchor: end; }
.chart .xl { fill: var(--muted); font-size: 11.5px; text-anchor: middle; }
.chart .bar path { fill: var(--teal); transition: fill .1s; }
.chart .bar.on path { fill: var(--lime-700); }
.chart .hit { fill: transparent; }
.chart .tip { position: absolute; top: 4px; display: grid; gap: 1px; padding: 6px 10px; background: var(--teal-900); color: #fff; border-radius: 10px; font-size: 13px; pointer-events: none; white-space: nowrap; box-shadow: var(--sh-lg); }
.as-table summary { cursor: pointer; font-size: 13px; font-weight: 700; color: var(--teal-700); }
.cbars { display: grid; gap: 12px; }
.cbar { display: grid; grid-template-columns: minmax(110px, 160px) minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.cl { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
.cl i { width: 10px; height: 10px; border-radius: 3px; }
.ct { height: 14px; background: var(--sage); border-radius: 0 4px 4px 0; overflow: hidden; }
.ct i { display: block; height: 100%; border-radius: 0 4px 4px 0; }
.cbar b { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--teal-900); }
.att { display: grid; gap: 8px; }
.att-item { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--sage); color: var(--teal-900); font-weight: 600; text-align: left; }
.att-item:hover { border-color: var(--teal-300); background: #fff; }
.att-item svg { width: 18px; height: 18px; color: var(--teal-500); }
.att-item .cnt { margin-left: auto; min-width: 26px; height: 24px; padding: 0 8px; border-radius: 12px; background: var(--teal); color: #fff; font-weight: 800; font-size: 13px; display: grid; place-items: center; }
.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; max-height: 320px; overflow-y: auto; }
.feed li { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; font-size: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--sage-200); }
.feed svg { width: 17px; height: 17px; color: var(--lime-700); margin-top: 2px; }
.feed small { color: var(--muted); white-space: nowrap; }
.toplist { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; counter-reset: t; }
ol.toplist li { display: grid; grid-template-columns: auto 1fr auto auto; gap: 10px; align-items: baseline; counter-increment: t; font-size: 14.5px; }
ol.toplist li::before { content: counter(t); font-weight: 800; color: var(--teal-300); }
ol.toplist small { color: var(--muted); }
.eng { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
.eng div { display: grid; grid-template-columns: auto 1fr; gap: 0 8px; align-items: center; padding: 10px 12px; background: var(--sage); border-radius: 12px; }
.eng svg { grid-row: span 2; width: 18px; height: 18px; color: var(--teal-500); }
.eng b { font-size: 20px; color: var(--teal-900); font-variant-numeric: tabular-nums; }
.eng small { color: var(--muted); font-size: 12.5px; }

/* ---------- order rows ---------- */
/* each list is a size container, so a row lays itself out by the space it really has (full page, dashboard card, phone) */
.rows { display: grid; gap: 8px; container-type: inline-size; }
.row.ord { display: grid; grid-template-columns: 112px minmax(140px, 1.1fr) minmax(0, 1.6fr) auto; gap: 12px; align-items: center; width: 100%; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: #fff; text-align: left; color: inherit; }
.row.ord:hover { border-color: var(--teal-300); box-shadow: var(--sh); }
.row.ord > span { display: grid; gap: 2px; min-width: 0; }
.row.ord b { color: var(--teal-900); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.ord small { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-items small { white-space: normal !important; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
/* status + amount on top, payment state below; right-aligned so amounts line up down the list */
.row.ord > .c-end { justify-items: end; gap: 5px; max-width: 270px; }
.c-top { display: flex; align-items: center; justify-content: flex-end; gap: 8px; min-width: 0; }
.c-top b { font-size: 15px; }
.c-pay { display: grid; justify-items: end; gap: 2px; min-width: 0; }
.c-pay .spill { white-space: normal; text-align: right; line-height: 1.3; }
.c-amt { justify-items: end; }
.c-st { justify-items: end; }
.demo { font-size: 11px !important; text-transform: uppercase; letter-spacing: .04em; }
.rows.compact > .row.ord { grid-template-columns: 96px minmax(0, 1fr) auto; }
.rows.compact .c-items { display: none !important; }
/* medium: the items move to their own line under the row */
@container (max-width: 660px) {

const WS_CSS = "/* VOICE   everyday work tool, warm and trustworthy, for women sellers and their customers\n   IDEA    a WhatsApp-first shop counter: the phone chat is always beside the work\n   PICTURE the live WhatsApp phone, product tiles in the deck's flat style, live ML charts\n   COLOUR  sage ground #F4F7EE, deep teal #1B434D ink and bands, lime #9EB83B for action and highlights\n   TYPE    Noto Serif (+ Devanagari) for titles, Mukta for everything else, both scripts\n   LAYOUT  teal app bar, content column + sticky phone at 1280px+, one column with a bottom tab bar on phones */\n:host {\n  color-scheme: light;\n  --teal: #1B434D; --teal-900: #0F2A31; --teal-700: #24545F; --teal-500: #3B6B76; --teal-300: #8FB0B6; --teal-100: #E2EBEA; --teal-50: #EFF4F3;\n  --lime: #9EB83B; --lime-700: #5F7518; --lime-600: #86A02A; --lime-200: #D6E59D; --lime-100: #EDF3D5; --lime-50: #F7FAEC;\n  --sage: #F4F7EE; --sage-200: #E6ECDA; --line: #DCE4D1; --line-2: #C9D4BD;\n  --ink: #17282D; --ink-2: #44575C; --muted: #64767A;\n  --mustard: #E3A83B; --pink: #D2648E; --aqua: #74BDBA; --terra: #C2603A; --maroon: #8C2B3F;\n  --wa: #25D366; --wa-ink: #06281A; --wa-head: #008069; --wa-bg: #EFEAE2; --wa-out: #D9FDD3;\n  --good: #2E7D32; --warn: #A86A12; --bad: #B3261E;\n  --r-sm: 10px; --r: 16px; --r-lg: 22px;\n  --sh: 0 1px 2px rgba(15, 42, 49, .06), 0 6px 18px rgba(15, 42, 49, .06);\n  --sh-lg: 0 18px 50px rgba(15, 42, 49, .22);\n  --display: \"Noto Serif\", \"Noto Serif Devanagari\", Georgia, serif;\n  --sans: Mukta, \"Noto Sans Devanagari\", system-ui, -apple-system, \"Segoe UI\", sans-serif;\n}\n*, *::before, *::after { box-sizing: border-box; min-width: 0; }\n:host { -webkit-text-size-adjust: 100%; scroll-padding-top: 84px; }\n:host { margin: 0; background: var(--sage); color: var(--ink); font: 16px/1.55 var(--sans); overflow-x: clip; }\nimg, svg, canvas { max-width: 100%; display: block; }\nbutton, input, select, textarea { font: inherit; color: inherit; }\nbutton { cursor: pointer; }\na { color: var(--teal); }\np { margin: 0; }\n[hidden] { display: none !important; }\n:focus-visible { outline: 3px solid var(--lime); outline-offset: 2px; border-radius: 6px; }\n.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }\n.skip { position: absolute; left: 12px; top: -60px; background: var(--lime); color: var(--teal-900); padding: 10px 14px; border-radius: 10px; z-index: 100; font-weight: 700; }\n.skip:focus { top: 12px; }\n:host([data-lang=\"mr\"]) { line-height: 1.62; }\n\n/* ---------- type ---------- */\n.h1 { font-family: var(--display); font-weight: 700; font-size: clamp(28px, 3.2vw, 40px); line-height: 1.08; letter-spacing: -.02em; margin: 0; color: var(--teal-900); text-wrap: balance; }\n.h2 { font-family: var(--display); font-weight: 700; font-size: clamp(20px, 2vw, 24px); line-height: 1.2; margin: 0; color: var(--teal-900); text-wrap: balance; }\n.h3 { font-weight: 700; font-size: 17px; line-height: 1.3; margin: 0; color: var(--teal-900); }\n.lead { font-size: 17px; color: var(--ink-2); max-width: 70ch; }\n.muted { color: var(--muted); }\n.small { font-size: 14px; }\n.tiny { font-size: 13px; }\n.num { font-variant-numeric: tabular-nums; }\n.nowrap { white-space: nowrap; }\n.label { display: block; font-weight: 600; font-size: 14px; color: var(--ink-2); margin-bottom: 6px; }\n\n/* ---------- app bar ---------- */\n.appbar { position: sticky; top: 0; z-index: 40; background: var(--teal); color: #fff; box-shadow: 0 2px 0 rgba(0, 0, 0, .05); }\n.appbar-in { max-width: 1440px; margin: 0 auto; display: flex; align-items: center; gap: 16px; padding: 10px max(16px, 2vw); min-height: 64px; }\n.brand { display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; flex: none; }\n.brand-mark { width: 38px; height: 38px; flex: none; }\n.brand-name { font-family: var(--display); font-weight: 700; font-size: 20px; line-height: 1.05; dis Color\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14M13 6l6 6-6 6\"/></svg><span data-i18n=\"mlHowFeed1\">real order baskets → recommender</span></span>\n        <span><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14M13 6l6 6-6 6\"/></svg><span data-i18n=\"mlHowFeed2\">sales CSVs the admin imports → price MLP</span></span>\n      </span>\n    </div>\n    <p class=\"mlhow-chips\"><span><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/></svg><span data-i18n=\"mlHowC1\">Zero GPU server cost</span></span><span><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"/><path d=\"M9 12l2 2 4-4\"/></svg><span data-i18n=\"mlHowC2\">On-device photo privacy</span></span><span><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 11a8 8 0 0 0-14.3-4.9L4 8\"/><path d=\"M4 4v4h4\"/><path d=\"M4 13a8 8 0 0 0 14.3 4.9L20 16\"/><path d=\"M20 20v-4h-4\"/></svg><span data-i18n=\"mlHowC3\">Retrains as real data arrives</span></span></p>\n  </div>\n</details>\n</div>\n\n  <div class=\"card\">\n    <div class=\"calc\">\n      <form class=\"stack\" id=\"priceForm\">\n        <div class=\"field\">\n          <span class=\"label\" data-i18n=\"fCategory\">Product category</span>\n          <div class=\"cat-pick\" id=\"catPick\"></div>\n        </div>\n        <div class=\"slider-row\">\n          <div class=\"top\"><label class=\"label\" for=\"inMat\" data-i18n=\"fMaterial\">Raw material cost (₹ per in</span></div>\n          <div class=\"kpi\"><b id=\"rHourly\" class=\"num\">—</b><span data-i18n=\"rHourly\">You earn per hour</span></div>\n          <div class=\"kpi\"><b id=\"rOrders\" class=\"num\">—</b><span data-i18n=\"rOrders\">Predicted orders / week</span></div>\n        </div>\n        <div class=\"warn-box\" id=\"rWarn\" hidden><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 4l9 16H3z\"/><path d=\"M12 10v4M12 17h.01\"/></svg><span id=\"rWarnText\"></span></div>\n        <div class=\"stack-sm\">\n          <div class=\"spread\"><span class=\"h3\" data-i18n=\"cmpTitle\">Middleman vs SheSell direct (per month)</span><span class=\"small muted\" id=\"cmpGain\"></span></div>\n          <div class=\"cmp\" id=\"cmp\"></div>\n          <div class=\"slider-row\">\n            <div class=\"top\"><label class=\"small\" for=\"inComm\" data-i18n=\"fCommission\">Middleman's cut (assumption)</label><output id=\"outComm\" class=\"num small\">40%</output></div>\n            <input class=\"range\" type=\"range\" id=\"inComm\" min=\"10\" max=\"60\" step=\"1\" value=\"40\">\n          </div>\n        </div>\n        <div class=\"stack-sm\">\n          <div class=\"row\">\n            <a class=\"btn btn-wa\" id=\"sharePrice\" href=\"https://wa.me/910000000000\" target=\"_blank\" rel=\"noopener\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3.5a8.5 8.5 0 0 0-7.4 12.7L3.5 20.5l4.4-1.1A8.5 8.5 0 1 0 12 3.5z\"/><path d=\"M9 8.6c.3 2.9 3.4 6.1 6.3 6.3l1.2-1.5-2-1.1-1 .9c-1-.4-2.4-1.8-2.8-2.8l.9-1-1.1-2z\"/></svg><span data-i18n=\"sharePrice\">Share price card on WhatsApp</span></a>\n            <button type=\"button\" class=\"btn btn-ghost btn-sm\" id=\"copyPrice\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2\"/><path d=\"M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3\"/></svg><span data-i18n=\"copyText\">Copy text</span></button>\n          </div>\n          <p class=\"tiny muted wa-official\" data-wa-hint></p>\n        </div>\n      </div>\n    </div>\n  </div>\n\n  <div class=\"grid-2\">\n    <div class=\"card\">\n      <div class=\"card-head\">\n        <div><h2 class=\"h2\" data-i18n=\"trainTitle\">Live training: multi-layer perceptron</h2><p class=\"small muted\" id=\"trainStatus\" data-i18n=\"trainWait\">Waiting for TensorFlow.js…</p></div>\n        <button type=\"button\" class=\"btn btn-teal btn-sm\" id=\"retrain\" disabled><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 11a8 8 0 0 0-14.3-4.9L4 8\"/><path d=\"M4 4v4h4\"/><path d=\"M4 13a8 8 0 0 0 14.3 4.9L20 16\"/><path d=\"M20 20v-4h-4\"/></svg><span data-i18n=\"retrain\">Retrain model</span></button>\n      </div>\n      <div class=\"arch\" id=\"arch\"></div>\n      <div class=\"row small mt-3 mb-1 items-center\">\n        <label for=\"inEpochs\" data-i18n=\"epochs\">Epochs</label>\n        <select class=\"input w-auto\" id=\"inEpochs\"><option>60</option><option selected>120</option><option>200</option><option>300</option></select>\n        <label for=\"inLr\" data-i18n=\"lr\">Learning rate</label>\n        <select class=\"input w-auto\" id=\"inLr\"><option>0.001</option><option>0.005</option><option selected>0.01</option><option>0.03</option></select>\n      </div>\n      <div class=\"chart-box\"><canvas id=\"lossChart\" role=\"img\" aria-label=\"Training and validation loss by epoch\" data-i18n-aria=\"lossAria\"></canvas></div>\n      <div class=\"metrics mt-3.5\" id=\"metrics\"></div>\n      <p class=\"tiny muted mt-2.5\" id=\"memLine\"></p>\n    </div>\n    <div class=\"card\">\n      <div class=\"card-head\">\n        <div><h2 class=\"h2\" data-i18n=\"curveTitle\">What the network learned</h2><p class=\"small muted\" id=\"curveSub\" data-i18n=\"curveSub\">Predicted fair price as labour hours change, holding your other inputs fixed. The dot is your product.</p></div>\n      </div>\n      <div class=\"seg curve-seg\" id=\"curveSeg\" role=\"group\" aria-label=\"Which output to inspect\" data-i18n-aria=\"curveSegAria\">\n        <button type=\"button\" data-mode=\"price\" aria-pressed=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 5h10M7 9h10M10 5c3 0 5 1.6 5 4s-2 4-5 4H7l7 7\"/></svg><span data-i18n=\"curveModePrice\">Fair price vs labour hours</span></button>\n        <button type=\"button\" data-mode=\"orders\" aria-pressed=\"false\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l8 4.5v9L12 21l-8-4.5v-9z\"/><path d=\"M4 7.5l8 4.5 8-4.5M12 12v9\"/></svg><span data-i18n=\"curveModeOrders\">Weekly orders vs festival demand</span></button>\n      </div>\n      <div class=\"chart-box\"><canvas id=\"curveChart\" role=\"img\" aria-label=\"Predicted price against labour hours\" data-i18n-aria=\"curveAriaPrice\"></canvas></div>\n      <p class=\"small mt-3\" id=\"curveNote\" data-i18n=\"curveNote\">A straight line would mean a simple formula. The bend shows the MLP picked up interactions between category, packaging and festival demand from the data.</p>\n    </div>\n  </div>\n\n  <div class=\"card\">\n    <div class=\"card-head\">\n      <div><h2 class=\"h2\" data-i18n=\"dataTitle\">Training data</h2><p class=\"small muted\" id=\"dataSub\"></p></div>\n      <div class=\"row\"><button type=\"button\" class=\"btn btn-ghost btn-sm\" id=\"copyCsv\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2\"/><path d=\"M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3\"/></svg><span data-i18n=\"copyCsv\">Copy CSV</span></button><button type=\"button\" class=\"btn btn-ghost btn-sm\" id=\"toggleRows\" data-i18n=\"showAll\">Show all rows</button></div>\n    </div>\n    <div class=\"table-wrap scroll-y\" id=\"dataTable\"></div>\n    <p class=\"tiny muted mt-2.5\" id=\"dataNote\"></p>\n  </div>\n</section>\n\n<!-- ===================== AI CATALOGUE (sellers + admin) ===================== -->\n<section class=\"view ws-view\" data-view=\"catalogue\" hidden>\n  <div class=\"view-head\">\n    <div>\n      <h1 class=\"h1\" data-i18n=\"catTitle\">Photo in, WhatsApp listing out</h1>\n      <p class=\"lead\" data-i18n=\"catSub\">A MobileNet image classifier runs in your browser to tag the product, score the photo and write a bilingual listing you can publish to the shop.</p>\n    </div>\n    <div class=\"stack-sm cnn-box\">\n      <span class=\"pill\" id=\"cnnStatus\"><span class=\"status-dot\" id=\"cnnDot\"></span><span id=\"cnnText\" data-i18n=\"cnnIdle\">MobileNet not loaded</span></span>\n      <button type=\"button\" class=\"btn btn-ghost btn-sm\" id=\"cnnRetry\" hidden><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 11a8 8 0 0 0-14.3-4.9L4 8\"/><path d=\"M4 4v4h4\"/><path d=\"M4 13a8 8 0 0 0 14.3 4.9L20 16\"/><path d=\"M20 20v-4h-4\"/></svg><span data-i18n=\"cnnRetry\">Try loading MobileNet again</span></button>\n    </div>\n  </div>\n\n  <div class=\"cat-grid\">\n    <div class=\"card stack\">\n      <div class=\"drop\" id=\"drop\">\n        <div class=\"hint\" id=\"dropHint\">\n          <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3.5\" y=\"4.5\" width=\"17\" height=\"15\" rx=\"2\"/><circle cx=\"9\" cy=\"10\" r=\"1.8\"/><path d=\"M4 18l5-5 4 4 3-3 4 4\"/></svg>\n          <b data-i18n=\"dropTitle\">Drop a product photo here</b>\n          <span class=\"small muted\" data-i18n=\"dropSub\">JPG or PNG from your phone or computer. Nothing is uploaded until you publish; the model runs on this device.</span>\n          <label class=\"btn btn-primary\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 16V4M7 9l5-5 5 5\"/><path d=\"M5 16v4h14v-4\"/></svg><span data-i18n=\"choosePhoto\">Choose photo</span><input type=\"file\" id=\"file\" accept=\"image/*\" class=\"sr-only\"></label>\n        </div>\n        <canvas id=\"cvPreview\" hidden></canvas>\n      </div>\n      <div class=\"stack-sm\">\n        <span class=\"label\" data-i18n=\"samplesTitle\">Or try a sample photo</span>\n        <div class=\"samples\" id=\"samples\"></div>\n        <p class=\"tiny muted\" data-i18n=\"samplesNote\">Sample photos are generated in code for this demo.</p>\n      </div>\n      <div class=\"row\">\n        <button type=\"button\" class=\"btn btn-ghost btn-sm\" id=\"changePhoto\" hidden><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 16V4M7 9l5-5 5 5\"/><path d=\"M5 16v4h14v-4\"/></svg><span data-i18n=\"changePhoto\">Use another photo</span></button>\n      </div>\n    </div>\n\n    <div class=\"card stack\" aria-live=\"polite\">\n      <div>\n        <h2 class=\"h2\" data-i18n=\"predTitle\">What the CNN sees</h2>\n        <p class=\"small muted\" data-i18n=\"predSub\">Top-3 ImageNet classes with confidence.</p>\n      </div>\n      <div class=\"stack-sm\" id=\"preds\"><p class= }
const L = (o) => (o ? (o[state.lang] || o.en || '') : '');

function fmtNum(n, d = 0) {

  catch (e) { return Number(n).toFixed(d); }
}
const inr = (n) => '₹' + fmtNum(Math.round(n));
const pct = (x, d = 0) => fmtNum(x * 100, d) + '%';

/* ---------- CDN libraries, loaded the first time a view needs them ---------- */
const CDN = {
  chart: 'https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js',
  tf: 'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js',
  mobilenet: 'https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1'
};
const libs = { tf: () => typeof window.tf !== 'undefined', chart: () => typeof window.Chart !== 'undefined', mobilenet: () => typeof window.mobilenet !== 'undefined' };
const LOADER = (() => {
  const loading = {};
  function script(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src; s.async = true; s.crossOrigin = 'anonymous';
      s.onload = () => resolve(); s.onerror = () => { s.remove(); reject(new Error('Could not load ' + src)); };
      document.head.appendChild(s);
    });
  }
  function need(name) {
    if (libs[name]()) return Promise.resolve();
    if (!loading[name]) {
      const p = name === 'mobilenet' ? need('tf').then(() => script(CDN.mobilenet)) : script(CDN[name]);
      loading[name] = p.catch(e => { delete loading[name]; throw e; });
    }
    return loading[name];
  }
  return { need };
})();

/* Two TF.js backends side by side. The 850-parameter pricing MLP runs on 'cpu': for a net this small,
   per-kernel GPU dispatch costs more than the maths (measured ~6x faster on an integrated GPU).
   MobileNet runs on 'webgl'. Synchronous blocks switch, run and restore the active backend; a tensor
   that lives on the other backend is moved by TF.js automatically, so results never depend on timing.
   Long async jobs that need the global backend (training, MobileNet download + warm-up) are queued. */
const ML = {
  pending: 0,
  queue: Promise.resolve(),
  has(name) { try { return libs.tf() && !!tf.findBackend(name); } catch (e) { return false; } },
  pick(name) { return ML.has(name) ? name : (libs.tf() ? tf.getBackend() : ''); },
  run(name, fn) {
    if (!ML.has(name)) return fn();
    const prev = tf.getBackend();
    if (prev === name) return fn();
    tf.setBackend(name);
    try { return fn(); } finally { if (prev) tf.setBackend(prev); }
  },
  exclusive(job) {
    ML.pending++;
    const run = ML.queue.then(job);
    ML.queue = run.catch(() => {}).then(() => { ML.pending--; });
    return run;
  }
};

/* ------------------------------------------------------------------
   Server calls from the workspace. The console's sign-in cookie comes
   along, and the server checks the role on every route.
------------------------------------------------------------------- */
const API = (() => {
  const st = { queue: [], timer: null };
  async function call(method, path, body) {
    let res;
    try {
      res = await fetch('/api' + path, {
        method, credentials: 'same-origin',
        headers: body !== undefined ? { 'Content-Type': 'application/json' } : {},
        body: body !== undefined ? JSON.stringify(body) : undefined
      });
    } catch (e) { const err = new Error(t('netError')); err.code = 'network'; throw err; }
    let data = {};
    try { data = await res.json(); } catch (e) { /* empty body */ }
    if (!res.ok) {
      const err = new Error((data.error && data.error.message) || t('netError'));
      err.status = res.status; err.code = data.error && data.error.code; err.info = data.error || {};
      if (res.status === 401 && CTX.signedOut) CTX.signedOut();
      throw err;
    }
    return data;
  }
  /* engagement counters (model trained, photo scanned, lesson done) go up in small batches */
  function track(type, productId, meta) {
    st.queue.push({ type, productId, meta });
    clearTimeout(st.timer);
    st.timer = setTimeout(flush, 1500);
  }
  function flush() {
    if (!st.queue.length) return;
    const events = st.queue.splice(0, 50);
    call('POST', '/events', { events }).catch(() => { /* best effort */ });
  }
  window.addEventListener('pagehide', flush);
  return { call, track, flush, get online() { return true; }, get me() { return CTX.me; } };
})();

/* ------------------------------------------------------------------
   Synthetic micro-enterprise transactions for the pilot area: rural
   Pune district and its neighbouring districts (Maharashtra).
   Generative story: cost-plus fair price (materials, fair hourly wage,
   packaging, festival premium) with log-normal market noise, and
   Poisson weekly orders driven by price elasticity + seasonality.
   The MLP never sees these formulas, only the noisy rows.
------------------------------------------------------------------- */
const DATAGEN = (() => {
  const CATS = ['food', 'tailoring', 'craft', 'agri'];
  const P = {
    food:      { mat: [25, 180],  hrs: [0.4, 3],    wage: 50, markup: 0.35, fest: 0.14, base: 24, ref: 150, elast: 0.75, boost: 0.9,  pkgP: [0.35, 0.45, 0.20] },
    tailoring: { mat: [40, 450],  hrs: [1, 6],      wage: 65, markup: 0.15, fest: 0.10, base: 7,  ref: 450, elast: 0.60, boost: 0.6,  pkgP: [0.40, 0.45, 0.15] },
    craft:     { mat: [30, 400],  hrs: [1, 8],      wage: 60, markup: 0.30, fest: 0.16, base: 5,  ref: 350, elast: 0.55, boost: 1.0,  pkgP: [0.25, 0.45, 0.30] },
    agri:      { mat: [15, 80],   hrs: [0.1, 1.2],  wage: 45, markup: 0.28, fest: 0.06, base: 38, ref: 60,  elast: 0.90, boost: 0.35, pkgP: [0.70, 0.25, 0.05] }
  };
  const PKG = [
    { cost: 5,  uplift: 0.00, attract: 0.00 },
    { cost: 18, uplift: 0.07, attract: 0.10 },
    { cost: 42, uplift: 0.16, attract: 0.18 }
  ];
  const ITEMS = {
    food: ['Chakli', 'Besan ladoo', 'Puran poli', 'Shankarpali', 'Mango pickle', 'Nachni papad', 'Karanji', 'Poha chivda'],
    tailoring: ['Blouse stitching', 'Kurti stitching', 'Saree fall & pico', 'Nauvari stitching', 'Parkar-polka', 'Petticoat', 'School uniform', 'Alterations'],
    craft: ['Handloom bag', 'Warli painting', 'Clay diyas', 'Bamboo basket', 'Bead toran', 'Akash kandil', 'Godhadi quilt', 'Jute bag'],
    agri: ['Tomatoes 1 kg', 'Pomegranates 1 kg', 'Jaggery 1 kg', 'Bananas 1 dozen', 'Indrayani rice 2 kg', 'Onions 2 kg', 'Methi bunch', 'Groundnuts 1 kg']
  };
  const ITEMS_MR = {
    food: ['चकली', 'बेसन लाडू', 'पुरणपोळी', 'शंकरपाळी', 'कैरीचे लोणचे', 'नाचणी पापड', 'करंजी', 'पोह्यांचा चिवडा'],
    tailoring: ['ब्लाउज शिलाई', 'कुर्ती शिलाई', 'साडी फॉल व पिको', 'नऊवारी शिलाई', 'परकर-पोलकं', 'पेटीकोट', 'शाळेचा गणवेश', 'कपड्यांत बदल'],
    craft: ['हातमाग पिशवी', 'वारली चित्र', 'मातीच्या पणत्या', 'बांबूची टोपली', 'मण्यांचे तोरण', 'आकाशकंदील', 'गोधडी', 'ज्यूट पिशवी'],
    agri: ['टोमॅटो १ किलो', 'डाळिंब १ किलो', 'गूळ १ किलो', 'केळी १ डझन', 'इंद्रायणी तांदूळ २ किलो', 'कांदे २ किलो', 'मेथीची जुडी', 'शेंगदाणे १ किलो']
  };
  // half the rows come from Pune district itself, the rest from the districts around it
  const DISTRICTS_MR = ['पुणे', 'सातारा', 'सोलापूर', 'अहिल्यानगर', 'रायगड', 'ठाणे'];
  const MONTHS_MR = ['जाने.', 'फेब्रु.', 'मार्च', 'एप्रिल', 'मे', 'जून', 'जुलै', 'ऑग.', 'सप्टें.', 'ऑक्टो.', 'नोव्हें.', 'डिसें.'];
  const DISTRICTS = ['Pune', 'Satara', 'Solapur', 'Ahilyanagar', 'Raigad', 'Thane'];
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const SEASON = [0.6, 0.35, 0.6, 0.55, 0.5, 0.2, 0.15, 0.45, 0.8, 0.85, 0.95, 0.4]; // Sankranti, Gudi Padwa, weddings, Ganeshotsav, Navratri, Diwali

  function rng(seed) {
    return () => {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const gauss = (r) => { let u = 0, v = 0; while (u === 0) u = r(); while (v === 0) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const poisson = (r, lam) => {
    if (lam > 40) return Math.max(0, Math.round(lam + Math.sqrt(lam) * gauss(r)));
    const L = Math.exp(-lam); let k = 0, p = 1;
    do { k++; p *= r(); } while (p > L);
    return k - 1;
  };
  const pick = (r, probs) => { let u = r(), acc = 0; for (let i = 0; i < probs.length; i++) { acc += probs[i]; if (u < acc) return i; } return probs.length - 1; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  /** The latent "fair price" rule used only to synthesise training rows. */
  function fairPrice(cat, mat, hrs, tier, season) {
    const c = P[cat], k = PKG[tier];
    return (mat * (1 + c.markup) + hrs * c.wage + k.cost) * (1 + k.uplift) * (1 + c.fest * season);
  }

  function generate(n = 240, seed = 2026) {
    const r = rng(seed), rows = [];
    const catP = [0.32, 0.22, 0.22, 0.24];
    for (let i = 0; i < n; i++) {
      const cat = CATS[pick(r, catP)], c = P[cat];
      const lm = Math.log(c.mat[0]) + r() * (Math.log(c.mat[1]) - Math.log(c.mat[0]));
      const mat = Math.round(Math.exp(lm));
      const mFrac = (lm - Math.log(c.mat[0])) / (Math.log(c.mat[1]) - Math.log(c.mat[0]));
      const hrs = Math.round(clamp(c.hrs[0] + (c.hrs[1] - c.hrs[0]) * clamp(0.65 * mFrac + 0.35 * r() + 0.08 * gauss(r), 0, 1), c.hrs[0], c.hrs[1]) * 4) / 4;
      const tier = pick(r, c.pkgP);
      const month = Math.floor(r() * 12);
      const season = Math.round(clamp(SEASON[month] + 0.1 * gauss(r), 0, 1) * 100) / 100;
      const price = Math.max(10, Math.round(fairPrice(cat, mat, hrs, tier, season) * Math.exp(0.07 * gauss(r)) / 5) * 5);
      const lam = clamp(c.base * Math.pow(c.ref / price, c.elast) * (1 + c.boost * season) * (1 + PKG[tier].attract), 0.3, 150);
      const orders = poisson(r, lam);
      const di = r() < 0.5 ? 0 : 1 + Math.floor(r() * (DISTRICTS.length - 1)), seller = r() < 0.42 ? 'SHG' : 'Individual', ii = Math.floor(r() * ITEMS[cat].length);
      rows.push({
        id: 'TX' + String(1001 + i), month: MONTHS[month], monthMr: MONTHS_MR[month], district: DISTRICTS[di], districtMr: DISTRICTS_MR[di],
        seller, cat, item: ITEMS[cat][ii], itemMr: ITEMS_MR[cat][ii], mat, hrs, tier, season, price, orders
      });
    }
    return rows;
  }

  /** Feature vector: one-hot category, ln(material) & hours (to be standardised), packaging tier, season. */
  function features(row) {
    const oh = CATS.map(c => (c === row.cat ? 1 : 0));
    return [...oh, Math.log(row.mat), row.hrs, row.tier / 2, row.season];
  }
  const targets = (row) => [Math.log(row.price), Math.log1p(row.orders)];

  function standardiser(matrix, cols) {
    const mu = [], sd = [];
    for (let j = 0; j < matrix[0].length; j++) {
      if (!cols.includes(j)) { mu.push(0); sd.push(1); continue; }
      const v = matrix.map(r => r[j]), m = v.reduce((a, b) => a + b, 0) / v.length;
      const s = Math.sqrt(v.reduce((a, b) => a + (b - m) ** 2, 0) / v.length) || 1;
      mu.push(m); sd.push(s);
    }
    return { mu, sd, apply: (row) => row.map((x, j) => (x - mu[j]) / sd[j]), invert: (row) => row.map((x, j) => x * sd[j] + mu[j]) };
  }

  /** Closed-form ridge regression (linear baseline). Returns predict(featureRow) → target row. */
  function linearBaseline(X, Y, lambda = 1e-3) {
    const n = X.length, d = X[0].length + 1, k = Y[0].length;
    const A = Array.from({ length: d }, () => new Array(d).fill(0));
    const Bm = Array.from({ length: d }, () => new Array(k).fill(0));
    for (let i = 0; i < n; i++) {
      const x = [1, ...X[i]];
      for (let a = 0; a < d; a++) {
        for (let b = 0; b < d; b++) A[a][b] += x[a] * x[b];
        for (let t = 0; t < k; t++) Bm[a][t] += x[a] * Y[i][t];
      }
    }
    for (let a = 1; a < d; a++) A[a][a] += lambda;
    // Gauss-Jordan solve A W = B
    const M = A.map((row, i) => row.concat(Bm[i]));
    for (let col = 0; col < d; col++) {
      let piv = col;
      for (let r = col + 1; r < d; r++) if (Math.abs(M[r][col]) > Math.abs(M[piv][col])) piv = r;
      [M[col], M[piv]] = [M[piv], M[col]];
      const pv = M[col][col] || 1e-12;
      for (let c = col; c < d + k; c++) M[col][c] /= pv;
      for (let r = 0; r < d; r++) if (r !== col) {
        const f = M[r][col];
        if (f) for (let c = col; c < d + k; c++) M[r][c] -= f * M[col][c];
      }
    }
    const W = M.map(row => row.slice(d));
    return (x) => {
      const xx = [1, ...x];
      return Array.from({ length: k }, (_, t) => xx.reduce((s, v, a) => s + v * W[a][t], 0));
    };
  }

  function r2(yTrue, yPred) {
    const m = yTrue.reduce((a, b) => a + b, 0) / yTrue.length;
    const ssr = yTrue.reduce((a, y, i) => a + (y - yPred[i]) ** 2, 0);
    const sst = yTrue.reduce((a, y) => a + (y - m) ** 2, 0) || 1;
    return 1 - ssr / sst;
  }
  const mae = (a, b) => a.reduce((s, y, i) => s + Math.abs(y - b[i]), 0) / a.length;

  function toCSV(rows) {
    const head = ['id', 'month', 'district', 'seller_type', 'category', 'item', 'material_cost_inr', 'labour_hours', 'packaging_tier', 'seasonal_demand', 'price_inr', 'weekly_orders'];
    const esc = (v) => (/[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v));
    return [head.join(',')].concat(rows.map(r => [r.id, r.month, r.district, r.seller, r.cat, r.item, r.mat, r.hrs, ['basic', 'standard', 'premium'][r.tier], r.season, r.price, r.orders].map(esc).join(','))).join('\n');
  }

  /* Real sales records (entered by the admin on the server, or imported from CSV) use the same
     columns as toCSV(). check() validates one record; fromRecord() maps it to a generate()-style row. */
  const TIERS = ['basic', 'standard', 'premium'];
  // Returns the cleaned record, or { error, message } where error names the bad column (the console translates it).
  function check(r) {
    const n = (v) => (v === '' || v === null || v === undefined ? NaN : Number(v));
    const bad = (error, message) => ({ error, message });
    if (!CATS.includes(r.cat)) return bad('cat', 'category must be one of ' + CATS.join(', '));
    const tier = typeof r.tier === 'string' && TIERS.includes(r.tier.toLowerCase()) ? TIERS.indexOf(r.tier.toLowerCase()) : n(r.tier);
    let season = n(r.season); if (season > 1 && season <= 100) season /= 100;
    const out = { cat: r.cat, mat: n(r.mat), hrs: n(r.hrs), tier, season, price: n(r.price), orders: n(r.orders) };
    if (!(out.mat >= 1 && out.mat <= 100000)) return bad('mat', 'material_cost_inr must be 1 to 100000');
    if (!(out.hrs >= 0.05 && out.hrs <= 200)) return bad('hrs', 'labour_hours must be 0.05 to 200');
    if (![0, 1, 2].includes(out.tier)) return bad('tier', 'packaging_tier must be basic, standard or premium (or 0, 1, 2)');
    if (!(out.season >= 0 && out.season <= 1)) return bad('season', 'seasonal_demand must be 0 to 1 (or 0 to 100)');
    if (!(out.price >= 1 && out.price <= 1000000)) return bad('price', 'price_inr must be 1 to 1000000');
    if (!(Number.isInteger(out.orders) && out.orders >= 0 && out.orders <= 10000)) return bad('orders', 'weekly_orders must be a whole number 0 to 10000');
    const mi = Number.isInteger(n(r.month)) && n(r.month) >= 0 && n(r.month) < 12 ? n(r.month) : MONTHS.findIndex(m => m.toLowerCase() === String(r.month || '').trim().slice(0, 3).toLowerCase());
    return Object.assign(out, { month: mi, district: String(r.district || '').trim().slice(0, 40), seller: /shg/i.test(String(r.seller || '')) ? 'SHG' : 'Individual', item: String(r.item || '').trim().slice(0, 60) });
  }
  function fromRecord(r, i = 0) {
    const di = DISTRICTS.findIndex(d => d.toLowerCase() === String(r.district || '').toLowerCase());
    const ii = CATS.includes(r.cat) ? ITEMS[r.cat].findIndex(x => x.toLowerCase() === String(r.item || '').toLowerCase()) : -1;
    const mi = Number.isInteger(r.month) && r.month >= 0 ? r.month : -1;
    return {
      id: r.id || 'RX' + String(1001 + i), real: true,
      month: mi >= 0 ? MONTHS[mi] : '—', monthMr: mi >= 0 ? MONTHS_MR[mi] : '—',
      district: di >= 0 ? DISTRICTS[di] : (r.district || '—'), districtMr: di >= 0 ? DISTRICTS_MR[di] : (r.district || '—'),
      seller: r.seller === 'SHG' ? 'SHG' : 'Individual', cat: r.cat,
      item: r.item || '—', itemMr: ii >= 0 ? ITEMS_MR[r.cat][ii] : (r.item || '—'),
      mat: Number(r.mat), hrs: Number(r.hrs), tier: Number(r.tier), season: Number(r.season), price: Number(r.price), orders: Number(r.orders)
    };
  }

  return { CATS, P, PKG, generate, features, targets, standardiser, linearBaseline, r2, mae, toCSV, rng, fairPrice, check, fromRecord };
})();

/* ------------------------------------------------------------------
   Seller Studio: MLP regression (TensorFlow.js) for fair price and
   weekly orders, with live Epoch vs MSE chart and a linear baseline.
   "What the network learned" plots either output of the 8→32→16→2 net:
   fair price against labour hours, or weekly orders against festival /
   seasonal demand, each with the seller's own product as a dot.
------------------------------------------------------------------- */
const STUDIO = (() => {
  const FESTS = [['festOff', 10], ['festRegular', 40], ['festWedding', 55], ['festPadwa', 62], ['festGanesh', 82], ['festDiwali', 96]];
  const DEFAULTS = { food: { mat: 80, hrs: 1.5 }, tailoring: { mat: 150, hrs: 3 }, craft: { mat: 140, hrs: 4 }, agri: { mat: 30, hrs: 0.5 } };
  const st = {
    cat: 'food', mat: 80, hrs: 1.5, tier: 1, season: 0.6, comm: 0.4,
    rows: [], train: [], val: [], sx: null, sy: null, model: null, training: false, trained: false, sigma: 0.08,
    lossChart: null, curveChart: null, metrics: null, baseline: null, seed: 2026, initSeed: 41, showAll: false, last: null, frame: 0,
    status: { key: 'trainWait', vars: null, extra: '' },
    server: null, nSyn: 240, nReal: 0, rerun: false, curveMode: 'price', started: false
  };
  function setStatus(key, vars, extra = '') { st.status = { key, vars, extra }; $('#trainStatus').textContent = t(key, vars) + extra; }

  /* Training rows: synthetic transactions (offline demo, or as configured on the server) plus the
     real sales records the admin keeps on the server. Fewer than 40 rows falls back to synthetic. */
  function prepareData() {
    const srv = st.server, sy = srv && srv.synthetic ? srv.synthetic : { enabled: true, n: 240, seed: st.seed };
    const real = srv && Array.isArray(srv.real) ? srv.real.map((r, i) => DATAGEN.fromRecord(r, i)) : [];
    let syn = sy.enabled ? DATAGEN.generate(sy.n, sy.seed) : [];
    if (syn.length + real.length < 40) syn = DATAGEN.generate(240, st.seed);
    st.nSyn = syn.length; st.nReal = real.length;
    st.rows = real.concat(syn);
    const idx = st.rows.map((_, i) => i), r = DATAGEN.rng(7);
    for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
    const nTr = Math.round(st.rows.length * 0.8);
    st.train = idx.slice(0, nTr).map(i => st.rows[i]);
    st.val = idx.slice(nTr).map(i => st.rows[i]);
    const Xtr = st.train.map(DATAGEN.features), Ytr = st.train.map(DATAGEN.targets);
    st.sx = DATAGEN.standardiser(Xtr, [4, 5]);
    st.sy = DATAGEN.standardiser(Ytr, [0, 1]);
    st.Xtr = Xtr.map(st.sx.apply); st.Ytr = Ytr.map(st.sy.apply);
    st.Xva = st.val.map(row => st.sx.apply(DATAGEN.features(row)));
    st.Yva = st.val.map(row => st.sy.apply(DATAGEN.targets(row)));
    const lin = DATAGEN.linearBaseline(st.Xtr, st.Ytr);
    const lp = st.Xva.map(x => st.sy.invert(lin(x)));
    st.baseline = {
      r2p: DATAGEN.r2(st.val.map(v => v.price), lp.map(p => Math.exp(p[0]))),
      r2o: DATAGEN.r2(st.val.map(v => v.orders), lp.map(p => Math.expm1(p[1])))
    };
  }

  function buildModel(lr, seed) {
    const m = tf.sequential();
    m.add(tf.layers.dense({ inputShape: [8], units: 32, activation: 'relu', kernelInitializer: tf.initializers.heNormal({ seed }) }));
    m.add(tf.layers.dense({ units: 16, activation: 'relu', kernelInitializer: tf.initializers.heNormal({ seed: seed + 1 }) }));
    m.add(tf.layers.dense({ units: 2, activation: 'linear', kernelInitializer: tf.initializers.glorotUniform({ seed: seed + 2 }) }));
    m.compile({ optimizer: tf.train.adam(lr), loss: 'meanSquaredError' });
    return m;
  }
  function disposeModel() {
    if (!st.model) return;
    try { if (st.model.optimizer) st.model.optimizer.dispose(); } catch (e) { /* already gone */ }
    st.model.dispose();
    st.model = null;
  }

  /* ---------- charts ---------- */
  const endLabels = {
    id: 'endLabels',
    afterDatasetsDraw(chart) {
      const { ctx } = chart;
      ctx.save();
      ctx.font = '600 12px Mukta, system-ui, sans-serif';
      ctx.fillStyle = '#44575C';
      ctx.textBaseline = 'middle';
      chart.data.datasets.forEach((ds, i) => {
        const meta = chart.getDatasetMeta(i);
        if (!meta.visible || !meta.data.length || ds.noEndLabel) return;
        const pt = meta.data[meta.data.length - 1];
        if (pt && Number.isFinite(pt.x) && Number.isFinite(pt.y)) ctx.fillText(ds.short || ds.label, pt.x + 6, pt.y + (i ? 8 : -8));
      });
      ctx.restore();
    }
  };
  function baseOpts(xTitle, yTitle) {
    return {
      animation: false, responsive: true, maintainAspectRatio: false, locale: locale(),
      layout: { padding: { right: 64, top: 4 } },
      interaction: { mode: 'index', intersect: false },
      scales: {
        x: { type: 'linear', title: { display: true, text: xTitle, color: '#44575C' }, ticks: { color: '#64767A', maxTicksLimit: 7 }, grid: { display: false }, border: { color: '#C9D4BD' } },
        y: { title: { display: true, text: yTitle, color: '#44575C' }, ticks: { color: '#64767A', maxTicksLimit: 6 }, grid: { color: '#E6ECDA' }, border: { display: false }, beginAtZero: true }
      },
      plugins: {
        legend: { display: true, position: 'top', align: 'end', labels: { boxWidth: 16, boxHeight: 3, color: '#44575C', font: { family: 'Mukta', size: 13 } } },
        tooltip: { backgroundColor: '#0F2A31', titleFont: { family: 'Mukta' }, bodyFont: { family: 'Mukta' }, padding: 10 }
      }
    };
  }
  function resetLossChart() {
    if (!libs.chart()) { const c = $('#lossChart'); if (c) c.replaceWith(Object.assign(document.createElement('p'), { className: 'small muted', textContent: t('noChartLib') })); return; }
    const data = { datasets: [
      { label: t('trainLoss'), short: t('trainShort'), data: [], borderColor: '#1B434D', borderWidth: 2, pointRadius: 0, tension: 0.25, parsing: false },
      { label: t('valLoss'), short: t('valShort'), data: [], borderColor: '#6E8A1F', borderWidth: 2, pointRadius: 0, tension: 0.25, parsing: false }
    ] };

  }
  function pushLoss(ep, loss, val) {

      item: (x) => ({ cat: st.cat, mat: st.mat, hrs: x, tier: st.tier, season: st.season }), you: () => st.hrs,

    orders: { sub: 'curveSubOrders', note: 'curveNoteOrders', aria: 'curveAriaOrders', x: 'seasonAxis', y: 'ordersAxis', line: 'curveLineOrders',
      sweep: () => { const v = []; for (let s = 0; s <= 1.0001; s += 0.025) v.push(Math.round(s * 1000) / 1000); return v; },
      item: (x) => ({ cat: st.cat, mat: st.mat, hrs: st.hrs, tier: st.tier, season: x }), you: () => st.season,
      value: (p) => Math.round(p.orders * 10) / 10, tick: (v) => fmtNum(v), tipX: (x) => pct(x), tipY: (y) => t('ordersPerWeek', { n: fmtNum(y, 1) }), xTick: (v) => pct(v) }

  function renderCurveText() {

  }
  function drawCurve() {
    renderCurveText();
    if (!st.trained || !libs.chart()) return;
    const c = CURVES[st.curveMode], xs = c.sweep();
    const preds = predictBatch(xs.map(c.item));
    const line = xs.map((x, i) => ({ x, y: c.value(preds[i]) }));
    const you = c.you(), cur = predict(c.item(you));

    if (st.curveChart) { st.curveChart.destroy(); st.curveChart = null; }
    const o = baseOpts(t(c.x), t(c.y));
    o.plugins.legend.display = false;
    o.interaction = { mode: 'nearest', intersect: false };
    o.scales.y.ticks.callback = c.tick;
    if (c.xTick) { o.scales.x.ticks.callback = c.xTick; o.scales.x.min = 0; o.scales.x.max = 1; }
    o.plugins.tooltip.callbacks = { title: (it) => c.tipX(it[0].parsed.x), label: (ctx) => c.tipY(ctx.parsed.y) };

  /* ---------- training ---------- */
  function renderArch(model) {
    const layers = [['archIn', '8', t('archInSub')], ['archH1', '32', 'ReLU'], ['archH2', '16', 'ReLU'], ['archOut', '2', t('archOutSub')]];
    $('#arch').innerHTML = layers.map(([k, n, sub], i) => `${i ? `<span class="arrow">${icon('arrow')}</span>` : ''}<span class="layer"><b>${esc(t(k))} · ${n}</b><span>${esc(sub)}</span></span>`).join('') +
      (model ? `<span class="pill" style="margin-left:6px">${esc(t('params', { n: fmtNum(model.countParams()) }))}</span>` : '');
  }
  async function train() {
    if (st.training || !libs.tf()) return;
    st.training = true;

  async function fitModel(btn) {

    const model = buildModel(lr, st.initSeed);

    state.metrics.trainings++;
    API.track('train');
    evaluate();
    const secs = (performance.now() - t0) / 1000;
    st.doneInfo = { n: epochs, s: secs, rows: st.train.length };
    setStatus('trainDone', { n: fmtNum(epochs), s: fmtNum(secs, 1), rows: fmtNum(st.train.length) });

  function evaluate() {
    const out = ML.run('cpu', () => tf.tidy(() => st.model.predict(tf.tensor2d(st.Xva)).arraySync()));
    const inv = out.map(o => st.sy.invert(o));

  /* ---------- inference ---------- */
  function predictBatch(items) {

/* ------------------------------------------------------------------
   Procedural sample product photos (no files, no network).
   Each scene is shaded per pixel (Lambert + Blinn-Phong, bump noise,
   soft shadows) so the CNN sees photo-like texture, not flat clip-art.
------------------------------------------------------------------- */
const PHOTOS = (() => {
  const rng = (seed) => () => {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  function makeNoise(seed) {
    const r = rng(seed), p = new Uint8Array(512), g = new Float32Array(256);
    const base = Array.from({ length: 256 }, (_, i) => i);
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = base[i]; base[i] = base[j]; base[j] = t; }
    for (let i = 0; i < 512; i++) p[i] = base[i & 255];
    for (let i = 0; i < 256; i++) g[i] = r() * 2 - 1;
    return (x, y) => {
      const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
      const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
      const X = xi & 255, Y = yi & 255;
      const a = g[p[p[X] + Y]], b = g[p[p[X + 1] + Y]], c = g[p[p[X] + Y + 1]], d = g[p[p[X + 1] + Y + 1]];
      const top = a + (b - a) * u, bot = c + (d - c) * u;
      return top + (bot - top) * v;
    };
  }
  const fbm = (n, x, y, o = 4) => { let s = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++) { s += a * n(x * f, y * f); f *= 2.03; a *= 0.5; } return s; };

        put(B, x, y, R + hl, G + hl, Bc + hl);
      }
    }
    const layouts = [
      [[0.24, 0.40, 0.17, 0.4], [0.58, 0.40, 0.165, 2.1], [0.22, 0.75, 0.165, 4.0], [0.57, 0.77, 0.17, 1.2], [0.40, 0.58, 0.18, 5.3]],
      [[0.30, 0.48, 0.24, 0.4], [0.62, 0.70, 0.22, 2.6], [0.28, 0.82, 0.18, 4.4]]
    ];
    layouts[opt.layout].forEach(([fx, fy, fr, rot], ci) => {
      const cx = fx * S, cy = fy * S, R = fr * S, turns = 2.3, w = R / (turns * 2 + 1.5);
      const a0 = w * 1.05, b = (R - w - a0) / (turns * Math.PI * 2), phiMax = turns * Math.PI * 2;
      softShadow(B, cx + R * 0.16, cy + R * 0.2, R * 0.98, R * 0.98, 0.5);
      const seeds = [];
      for (let s2 = 0; s2 < 30; s2++) seeds.push([r() * phiMax, (r() - 0.5) * 1.2, r() * Math.PI]);
      for (let y = Math.max(0, Math.floor(cy - R * 1.2)); y < Math.min(S, cy + R * 1.2); y++)
        for (let x = Math.max(0, Math.floor(cx - R * 1.2)); x < Math.min(S, cx + R * 1.2); x++) {
          const dx = x - cx, dy = y - cy, rho = Math.hypot(dx, dy);
          if (rho > R * 1.2) continue;
          let ang = Math.atan2(dy, dx) - rot; ang = ((ang % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
          let best = null;
          for (let k = 0; k <= Math.ceil(turns); k++) {
            const ph = ang + k * Math.PI * 2;
            if (ph > phiMax) break;
            const wob = 1 + opt.wob * n(ph * 0.9 + ci * 5, ci);
            const ww = w * (1 + 0.25 * n2(ph * 2.1, ci * 3));
            const dd = rho - (a0 + b * ph) * wob;
            if (Math.abs(dd) < ww && (!best || Math.abs(dd) / ww < Math.abs(best.dd) / best.ww)) best = { dd, ph, ww };
          }
          if (!best) continue;
          const v = best.dd / best.ww, vv = Math.min(0.999, Math.abs(v));
          const ca = Math.cos(ang + rot), sa = Math.sin(ang + rot);
          const ridge = Math.sin(v * Math.PI * 2.5) * opt.ridge * 2;
          const crumb = (n2(x * 0.45, y * 0.45) + 0.6 * n(x * 0.9, y * 0.9)) * 0.45;
          const nn = norm3(ca * (v + ridge) + crumb, sa * (v + ridge) + crumb * 0.8, Math.sqrt(1 - vv * vv) + 0.05);
          const [d, sp] = lightAt(nn, opt.gloss, 18, 0.3);
          const fry = 0.5 + 0.5 * fbm(n, x * 0.05 + ci * 3, y * 0.05, 3);
          const edgeDark = 1 - 0.45 * Math.pow(vv, 2.5);
          let Rr = mix(0.80, 0.52, fry), G = mix(0.52, 0.28, fry), Bc = mix(0.20, 0.08, fry);
          for (const [sp2, sv, so] of seeds) {
            const dph = (best.ph - sp2) * (a0 + b * best.ph) / best.ww, dv = (v - sv);
            const ex = dph * Math.cos(so) + dv * Math.sin(so), ey = -dph * Math.sin(so) + dv * Math.cos(so);
            if (ex * ex / 0.11 + ey * ey / 0.03 < 1) { Rr = 0.92; G = 0.87; Bc = 0.72; }
          }
          const k = d * edgeDark;
          put(B, x, y, Rr * k + sp, G * k + sp * 0.9, Bc * k + sp * 0.65, smooth(1, 0.85, vv));
        }
    });
    return finish(B, 13, 0.3);
  }

  /* ---------- Block-print cotton kurta on a hanger ---------- */
  function kurta(S = 448) {
    const B = canvasBuf(S), n = makeNoise(5), n2 = makeNoise(7);
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
      const t = y / S, k = 0.03 * fbm(n, x * 0.015, y * 0.015, 4) - 0.05 * Math.hypot(x / S - 0.5, t - 0.4);
      put(B, x, y, 0.91 + k, 0.89 + k, 0.85 + k);
    }
    const P = (x, y) => [x * S, y * S];
    const half = [P(0.07, 0.165), P(0.205, 0.205), P(0.265, 0.235), P(0.355, 0.500), P(0.270, 0.535), P(0.205, 0.345), P(0.230, 0.925)];
    const poly = [P(0.5, 0.215)];
    half.forEach(([x, y]) => poly.push([S * 0.5 + x, y]));
    for (let i = half.length - 1; i >= 0; i--) poly.push([S * 0.5 - half[i][0], half[i][1]]);
    const inside = (x, y) => {
      let c = false;
      for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const [xi, yi] = poly[i], [xj, yj] = poly[j];
        if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) c = !c;
      }
      return c;
    };
    // wall shadow
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
      let s = 0;
      for (const [ox, oy] of [[14, 16], [20, 20], [10, 22], [18, 12]]) if (inside(x - ox, y - oy)) s++;
      if (s) shade(B, x, y, 1 - 0.07 * s);
    }
    // hanger hook and bar
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
      const hx = x - 0.5 * S, hy = y - 0.105 * S, hr = Math.hypot(hx, hy);
      if (y < 0.13 * S && Math.abs(hr - 0.035 * S) < 0.0055 * S && !(hx < 0 && hy > 0)) {
        const k = 0.55 + 0.4 * (1 - (hy / (0.035 * S) + 1) * 0.5);
        put(B, x, y, k * 0.75, k * 0.77, k * 0.8);
      }
      if (x > 0.495 * S && x < 0.505 * S && y > 0.13 * S && y < 0.165 * S) put(B, x, y, 0.5, 0.52, 0.55);
      const bx = (x - 0.5 * S) / (0.27 * S), by = 0.165 * S + Math.pow(Math.abs(bx), 1.6) * 0.06 * S;
      if (Math.abs(bx) < 1 && Math.abs(y - by) < 0.011 * S) {
        const v = (y - by) / (0.011 * S), k = 0.75 + 0.25 * (1 - Math.abs(v)) - 0.2 * v;
        put(B, x, y, 0.52 * k, 0.33 * k, 0.18 * k);
      }
    }
    const motif = (u, v) => {
      const cx = Math.floor(u / 26), cy = Math.floor(v / 26), off = (cy % 2) * 13;
      const lx = ((u + off) % 26) - 13, ly = (v % 26) - 13;
      const rr = Math.hypot(lx, ly), aa = Math.atan2(ly, lx);
      const petal = rr < 6.5 * (0.6 + 0.4 * Math.abs(Math.cos(aa * 2.5)));
      return (petal && rr > 1.6) || (cx + cy) < -999 ? 1 : 0;
    };
    const ss = [[0.25, 0.25], [0.75, 0.25], [0.25, 0.75], [0.75, 0.75]];
    for (let y = Math.floor(0.16 * S); y < Math.ceil(0.94 * S); y++) for (let x = Math.floor(0.12 * S); x < Math.ceil(0.88 * S); x++) {
      let cov = 0;
      for (const [sx, sy] of ss) if (inside(x + sx, y + sy)) cov++;
      if (!cov) continue;
      const xr = (x - 0.5 * S) / S, yr = y / S;
      const isSleeve = Math.abs(xr) > 0.205 + (yr - 0.24) * 0.04 && yr < 0.54;
      const hemY = 0.925 + 0.012 * Math.sin(xr * 38 + 1.3) + 0.006 * Math.sin(xr * 90);
      if (!isSleeve && yr > hemY) continue;
      if (!isSleeve && yr > 0.80 && Math.abs(Math.abs(xr) - (0.205 + (yr - 0.34) * 0.045)) < (yr - 0.80) * 0.12) continue;
      const drapeF = 34 + 10 * yr, ph = xr * drapeF + fbm(n, yr * 2.2, xr * 3, 2) * 5;
      const amp = isSleeve ? 0.0 : 0.08 + 0.32 * smooth(0.3, 0.95, yr);
      const fold = isSleeve ? Math.sin(yr * 60 + xr * 40) * 0.22 : Math.sin(ph) * amp;
      const bodyHalf = 0.205 + Math.max(0, yr - 0.34) * 0.045;
      const cyl = isSleeve ? 0 : clamp(xr / bodyHalf, -1, 1);
      const nn = norm3(fold + cyl * 0.75, isSleeve ? 0.3 : -0.08 + 0.15 * smooth(0.85, 0.93, yr), 1);
      const [d, sp] = lightAt(nn, 0.10, 14, 0.4);
      const weave = 0.03 * (n2(x * 0.9, y * 0.12) + n2(x * 0.12, y * 0.9));
      let R = 0.13, G = 0.22, Bc = 0.42;
      const disp = Math.cos(ph) * amp * 9;
      if (motif(x - 0.5 * S + 400 + disp, y) && !(yr > 0.86)) { R = 0.92; G = 0.89; Bc = 0.80; }
      if (yr > 0.86 && yr < 0.915) {
        const zig = Math.abs(((x / 9) % 2) - 1) * 0.02 + 0.875;
        R = 0.55; G = 0.10; Bc = 0.18;
        if (Math.abs(yr - zig) < 0.006 || Math.abs(yr - 0.905) < 0.003) { R = 0.86; G = 0.66; Bc = 0.22; }
      }
      if (isSleeve) {
        const ax = Math.abs(xr) - 0.355, ay = yr - 0.5, dxl = -0.085, dyl = 0.035;
        const sd = (ax * dyl - ay * dxl) / Math.hypot(dxl, dyl);
        if (sd > -0.034) { R = 0.55; G = 0.10; Bc = 0.18; if (Math.abs(sd + 0.026) < 0.003) { R = 0.86; G = 0.66; Bc = 0.22; } }
      }
      const pl = Math.abs(xr) < 0.016 && yr > 0.2 && yr < 0.38;
      if (pl) { R *= 1.15; G *= 1.15; Bc *= 1.15; }
      for (const by of [0.245, 0.285, 0.325, 0.36]) if (Math.hypot(xr, yr - by) < 0.0075) { R = 0.95; G = 0.92; Bc = 0.85; }
      const neck = Math.hypot(xr / 0.07, (yr - 0.165) / 0.06);
      if (neck < 1.0) continue;
      if (neck < 1.16) { R = 0.55; G = 0.10; Bc = 0.18; }
      const shadeNeck = neck < 1.3 ? 0.82 : 1;
      const k = d * shadeNeck * (1 + weave);
      put(B, x, y, R * k + sp, G * k + sp, Bc * k + sp, cov / 4);
    }
    return finish(B, 3, 0.18);
  }

  const SCENES = { oranges, pot, chakli, kurta };
  function render(kind, S, o) { return SCENES[kind](S, o); }
  function toCanvas(kind, S = 448, o) {
    const img = render(kind, S, o), cv = document.createElement('canvas');
    cv.width = img.w; cv.height = img.h;
    cv.getContext('2d').putImageData(new ImageData(img.data, img.w, img.h), 0, 0);
    return cv;
  }
  return { render, toCanvas, kinds: Object.keys(SCENES) };
})();

  /* ---------- photo metrics ---------- */
  function photoStats(canvas) {
