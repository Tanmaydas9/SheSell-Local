      return { mean, std, lapVar, via: 'tf' };
    } catch (e) { console.warn('TF photo stats failed, using JS', e); }
    const d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data, W = c.width, H = c.height;
    const g = new Float32Array(W * H);
    let s = 0;
    for (let i = 0; i < W * H; i++) { g[i] = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2]; s += g[i]; }
    const mean = s / g.length;
    let v = 0; for (let i = 0; i < g.length; i++) v += (g[i] - mean) ** 2;
    let ls = 0, ls2 = 0, n = 0;
    for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
      const i = y * W + x, l = g[i - W] + g[i + W] + g[i - 1] + g[i + 1] - 4 * g[i];
      ls += l; ls2 += l * l; n++;
    }
    return { mean, std: Math.sqrt(v / g.length), lapVar: ls2 / n - (ls / n) ** 2, via: 'js' };
  }
  function readiness(meta, stats, preds, mapping) {
    const minSide = Math.min(meta.w, meta.h), ratio = minSide / Math.max(meta.w, meta.h);
    const res = minSide < 240 ? clamp((minSide - 64) / (240 - 64), 0, 1) * 0.35 : clamp(0.35 + 0.65 * (Math.log2(minSide) - Math.log2(240)) / (Math.log2(1024) - Math.log2(240)), 0, 1);
    const L = stats.mean;
    const bright = L < 105 ? clamp((L - 40) / 65, 0, 1) : L > 185 ? clamp((235 - L) / 50, 0, 1) : 1;
    const contrast = clamp((stats.std - 18) / (55 - 18), 0, 1);
    const sharp = clamp((Math.log10(Math.max(stats.lapVar, 1)) - 0.9) / (2.3 - 0.9), 0, 1);
    const frame = clamp((ratio - 0.45) / 0.55, 0, 1);
    const parts = [['resolution', res, 0.15], ['brightness', bright, 0.2], ['contrast', contrast, 0.15], ['sharpness', sharp, 0.2], ['framing', frame, 0.1]];
    if (preds && mapping) parts.push(['subject', clamp(0.5 * clamp(preds[0].probability / 0.6, 0, 1) + 0.5 * mapping.conf, 0, 1), 0.2]);
    const wsum = parts.reduce((a, p) => a + p[2], 0);
    const score = parts.reduce((a, p) => a + p[1] * p[2], 0) / wsum;
    return { score, parts, dark: L < 105, glare: L > 185 };
  }

  /* ---------- CNN -> SheSell category ---------- */
  function mapCats(preds) {
    const score = { food: 0, tailoring: 0, craft: 0, agri: 0 };
    let best = null, mass = 0;
    preds.forEach(p => {
      const syns = p.className.toLowerCase().split(',').map(s => s.trim());
      let rule = null;
      for (const s of syns) { if (RULE_MAP.has(s)) { rule = RULE_MAP.get(s); break; } }
      if (!rule) return;
      const v = p.probability * rule[2];
      score[rule[1]] += v; mass += v;
      if (!best || v > best.v) best = { v, cat: rule[1], key: rule[3], cls: syns[0] };
    });
    const total = preds.reduce((a, p) => a + p.probability, 0) || 1;
    const ranked = CAT_KEYS.map(c => ({ c, v: mass ? score[c] / mass : 0 })).sort((a, b) => b.v - a.v);
    const cat = mass > 0.02 ? ranked[0].c : null;
    return { cat, ranked, conf: mass ? ranked[0].v * Math.min(1, mass / total / 0.35) : 0, coverage: mass / total, key: best && best.cat === cat ? best.key : null };
  }

  /* ---------- rendering ---------- */
  function drawPreview(canvas) {
    const cv = $('#cvPreview'), k = Math.min(1, 640 / Math.max(canvas.width, canvas.height));
    cv.width = Math.round(canvas.width * k); cv.height = Math.round(canvas.height * k);
    cv.getContext('2d').drawImage(canvas, 0, 0, cv.width, cv.height);
    cv.hidden = false; $('#dropHint').hidden = true; $('#changePhoto').hidden = false;
  }
  function dial(score) {
    const r = 50, c = 2 * Math.PI * r, v = clamp(score, 0, 1);
    const col = v >= 0.75 ? '#9EB83B' : v >= 0.5 ? '#E3A83B' : '#C2603A';
    $('#dial').innerHTML = `<circle cx="60" cy="60" r="${r}" fill="none" stroke="#E6ECDA" stroke-width="12"/>
      <circle cx="60" cy="60" r="${r}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(c * v).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 60 60)"/>
      <text x="60" y="62" text-anchor="middle" font-size="30" font-weight="800" fill="#0F2A31" font-family="Mukta, sans-serif">${esc(fmtNum(Math.round(v * 100)))}</text>
      <text x="60" y="82" text-anchor="middle" font-size="12" fill="#64767A" font-family="Mukta, sans-serif">/ ${esc(fmtNum(100))}</text>`;
    $('#dial').setAttribute('aria-label', t('readyAria', { n: fmtNum(Math.round(v * 100)) }));
  }
  function renderResults() {
    const r = st.result;
    if (!r) {
      $('#preds').innerHTML = `<p class="small muted">${esc(st.failed ? t(st.reason || 'cnnFail') : t('predEmpty'))}</p>`;
      $('#catMap').innerHTML = ''; $('#subscores').innerHTML = ''; $('#tips').innerHTML = ''; dial(0);
      return;
    }
    if (r.preds) {
      $('#preds').innerHTML = r.preds.slice(0, 3).map(p => `<div class="pred"><span class="name">${esc(p.className.split(',')[0])}</span><span class="pct">${pct(p.probability, 1)}</span><span class="meter teal"><i style="width:${(p.probability * 100).toFixed(1)}%"></i></span></div>`).join('');
    } else {
      $('#preds').innerHTML = `<p class="small muted">${esc(st.failed ? t(st.reason || 'cnnFail') : t('cnnWaitPred'))}</p>`;
    }
    const m = r.mapping, chosen = r.override || (m && m.cat);
    $('#catMap').innerHTML = m ? m.ranked.map(x => `<div class="pred"><span class="name"><span class="status-dot cat-dot-${x.c}"></span> ${esc(catName(x.c))}${x.c === chosen ? ` <span class="pill pill-lime" style="margin-left:4px">${icon('check')}${esc(t('chosen'))}</span>` : ''}</span><span class="pct">${pct(x.v)}</span><span class="meter"><i style="width:${(x.v * 100).toFixed(1)}%"></i></span></div>`).join('') +
      (m.cat ? '' : `<p class="small muted">${esc(t('mapUnsure'))}</p>`) : `<p class="small muted">${esc(st.failed ? t('mapOffline') : t('cnnWaitPred'))}</p>`;
    $('#catOverride').innerHTML = `<option value="">${esc(t('autoCat'))}</option>` + CAT_KEYS.map(c => `<option value="${c}" ${r.override === c ? 'selected' : ''}>${esc(catName(c))}</option>`).join('');
    const rd = r.ready;
    dial(rd.score);
    const names = { resolution: t('sRes'), brightness: t('sBright'), contrast: t('sContrast'), sharpness: t('sSharp'), framing: t('sFrame'), subject: t('sSubject') };
    $('#subscores').innerHTML = rd.parts.map(([k, v]) => `<div class="subscore"><span>${esc(names[k])}</span><b class="num">${esc(fmtNum(Math.round(v * 100)))}</b><span class="meter"><i style="width:${(v * 100).toFixed(0)}%;background:${v >= 0.6 ? 'var(--lime)' : v >= 0.35 ? 'var(--mustard)' : 'var(--terra)'}"></i></span></div>`).join('');
    const tips = [];
    rd.parts.forEach(([k, v]) => {
      if (v >= 0.6) return;
      if (k === 'brightness') tips.push(rd.dark ? t('tipDark') : t('tipBright'));
      else tips.push(t({ resolution: 'tipRes', contrast: 'tipContrast', sharpness: 'tipSharp', framing: 'tipFrame', subject: 'tipSubject' }[k]));
    });
    if (!tips.length) tips.push(t('tipGreat'));
    $('#tips').innerHTML = tips.map(x => `<li>${icon('spark')}<span>${esc(x)}</span></li>`).join('');
  }

  /* ---------- who the listing is for ---------- */
  const sellerById = (id) => state.sellers.find(s => s.id === id) || null;
  function boundSeller() {
    if (isAdmin()) return sellerById(st.sellerId);
    return mySeller();
  }
  const nameOf = (s, lang) => (lang === 'mr' && s.nameMr ? s.nameMr : s.name);
  const placeOf = (s, lang) => (lang === 'mr' && s.placeMr ? s.placeMr : s.place) || '';
  function renderBind() {
    const el = $('#bindRow');
    if (isAdmin()) {
      const opts = state.sellers.filter(s => s.active).map(s => `<option value="${esc(s.id)}"${s.id === st.sellerId ? ' selected' : ''}>${esc(nameOf(s, state.lang))} · ${esc(placeOf(s, state.lang))}${s.verified ? '' : ' · ' + esc(t('bindUnverified'))}</option>`).join('');
      el.innerHTML = `<img src="${AVATARS.shg}" alt=""><label class="stack-sm"><b class="small">${esc(t('bindAdminLabel'))}</b><select class="input" id="lSellerId"><option value="">${esc(t('bindChoose'))}</option>${opts}</select></label><span class="small muted">${esc(t('bindAdminNote'))}</span>`;
      return;
    }
    const s = mySeller();
    el.innerHTML = s ? `<img src="${s.type === 'shg' ? AVATARS.shg : AVATARS.mom}" alt="">
      <div class="stack-sm"><span class="tiny muted">${esc(t('bindSellerLabel'))}</span><b>${esc(nameOf(s, state.lang))}</b><span class="small muted">${esc(s.type === 'shg' ? t('typeShg') : t('typeInd'))} · ${esc(placeOf(s, state.lang))}</span></div>
      <span class="pill ${s.verified ? 'pill-lime' : ''}">${icon(s.verified ? 'shield' : 'clock')}<span>${esc(t(s.verified ? 'bindVerified' : 'bindReview'))}</span></span>` : '';
  }

  /* ---------- availability / lead time ---------- */
  function renderLeadSelect() {
    const cur = $('#lLead').value || DEFAULT_LEAD[st.cat || 'craft'];
    $('#lLead').innerHTML = LEADS.map(k => `<option value="${k}"${k === cur ? ' selected' : ''}>${esc(k === 'custom' ? t('leadCustom') : t('lead_' + k))}</option>`).join('');
    toggleCustomLead();
  }
  function toggleCustomLead() { $$('[data-custom-lead]').forEach(f => { f.hidden = $('#lLead').value !== 'custom'; }); }
  const leadFor = (lang, d) => (d.lead === 'custom' ? (lang === 'mr' ? d.leadTextMr || d.leadText : d.leadText) : (I18N[lang]['lead_' + d.lead] || I18N.en['lead_' + d.lead]));

  /* ---------- fair price from the Seller Studio MLP ---------- */
  function mlpInputs() {
    const d = STUDIO.DEFAULTS[st.cat] || STUDIO.DEFAULTS.craft;
    return { cat: st.cat, mat: Math.max(1, Number($('#lMat').value) || d.mat), hrs: Math.max(0.25, Number($('#lHrs').value) || d.hrs), tier: Number($('#lTier').value) || 0, season: STUDIO.season };
  }
  function renderPrice(apply) {
    const src = $('#priceSrc'), range = $('#mlpRange');
    const p = st.result ? STUDIO.priceFor(mlpInputs()) : null;
    if (p) {
      src.textContent = t('priceSrcMlp', { rows: fmtNum(p.rows) }); src.className = 'small ok';
      range.textContent = t('mlpRange', { lo: inr(p.lo), hi: inr(p.hi), o: fmtNum(Math.round(p.orders)) });
      if (apply || !st.priceTouched) { $('#lPrice').value = p.price; st.priceTouched = false; }
    } else {
      src.className = 'small muted';
      src.textContent = t(STUDIO.started && !libs.tf() ? 'priceSrcFallback' : 'priceSrcTraining');
      range.textContent = '';
      if (st.result && (apply || !st.priceTouched || !$('#lPrice').value)) $('#lPrice').value = ({ food: 150, tailoring: 450, craft: 350, agri: 80 }[st.cat]);
    }
    $('#useMlp').disabled = !p;
  }

  /* ---------- listing ---------- */
  function names(cat, key) {
    const k = key && I18N.en['pn_' + key] ? 'pn_' + key : 'pn_' + cat;
    return { en: I18N.en[k], mr: I18N.mr[k] };
  }
  function listingText(lang, d) {
    const tl = (k, v) => { let s = I18N[lang][k] ?? I18N.en[k]; return s.replace(/\{(\w+)\}/g, (_, x) => v[x] ?? ''); };
    const price = '₹' + new Intl.NumberFormat(lang === 'mr' ? 'mr-IN' : 'en-IN').format(d.price);
    const s = d.seller;
    return tl('listTpl', {
      name: lang === 'mr' ? d.nameMr : d.name, seller: s ? nameOf(s, lang) : tl('sellerDefault', {}), place: s ? placeOf(s, lang) : tl('placeDefault', {}),
      blurb: I18N[lang]['blurb_' + d.cat], lead: leadFor(lang, d), price, tag: I18N.en['tag_' + d.cat], link: s ? shopUrl('?seller=' + encodeURIComponent(s.id)) : shopUrl()
    });
  }
  function fillListing(keepUser) {
    const r = st.result;
    if (!r) return;
    const cat = r.override || (r.mapping && r.mapping.cat) || (!r.preds && r.meta.sampleCat) || 'craft';
    const n = names(cat, r.override ? null : (r.mapping && r.mapping.key));
    const sample = r.meta.sample ? SAMPLES.find(s => s.key === r.meta.sample) : null;
    const changedCat = st.cat !== cat;
    st.cat = cat;
    if (!keepUser) {
      $('#lName').value = sample ? I18N.en[sample.name] : n.en;
      $('#lNameMr').value = sample ? I18N.mr[sample.name] : n.mr;
      const d = STUDIO.DEFAULTS[cat] || STUDIO.DEFAULTS.craft;
      if (changedCat || !$('#lMat').value) { $('#lMat').value = d.mat; $('#lHrs').value = d.hrs; }
      if (!st.leadTouched) $('#lLead').value = DEFAULT_LEAD[cat];
      st.priceTouched = false;
    }
    renderLeadSelect();
    renderPrice(false);
    updateText();
    $('#publish').disabled = false;
    $('#pubNote').hidden = true;
  }
  function draftData() {
    const s = boundSeller();
    return {
      cat: st.cat, name: $('#lName').value.trim() || I18N.en['pn_' + st.cat], nameMr: $('#lNameMr').value.trim() || I18N.mr['pn_' + st.cat],
      price: Math.max(5, Math.round(Number($('#lPrice').value) || 0)), seller: s, sellerId: s ? s.id : '',
      lead: $('#lLead').value || DEFAULT_LEAD[st.cat], leadText: $('#lLeadText').value.trim(), leadTextMr: $('#lLeadTextMr').value.trim()
    };
  }
  function updateText() {
    const d = draftData();
    $('#lTextEn').value = listingText('en', d);
    $('#lTextMr').value = listingText('mr', d);
    $('#shareListing').href = waLink(state.lang === 'mr' ? $('#lTextMr').value : $('#lTextEn').value);
  }

  /* ---------- analysis ---------- */
  async function analyze(canvas, meta) {
    st.current = { canvas, meta };
    drawPreview(canvas);
    const stats = photoStats(canvas);
    let preds = null, mapping = null;
    if (st.ready) {
      try { preds = await ML.run('webgl', () => st.model.classify(canvas, 10)); mapping = mapCats(preds); }
      catch (e) { console.error(e); }
    } else if (!st.failed) { load(); }
    const override = st.result && st.result.meta === meta ? st.result.override : null;
    st.result = { meta, stats, preds, mapping, override, ready: readiness(meta, stats, preds, mapping) };
    renderResults();
    fillListing(false);
    if (preds) API.track('scan', null, st.cat);
  }
  function toWorking(img, w, h) {
    const k = Math.min(1, 1024 / Math.max(w, h)), c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c;
  }
  function loadFile(file) {
    if (!file || !/^image\//.test(file.type)) { toast(t('notImage'), 'alert'); return; }
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const c = toWorking(img, img.naturalWidth, img.naturalHeight);
      URL.revokeObjectURL(url);
      $$('#samples .sample').forEach(b => b.setAttribute('aria-pressed', 'false'));
      analyze(c, { source: 'upload', w: img.naturalWidth, h: img.naturalHeight });
    };
    img.onerror = () => { URL.revokeObjectURL(url); toast(t('notImage'), 'alert'); };
    img.src = url;
  }
  function renderSamples() {
    const started = st.samplesStarted;
    st.samplesStarted = true;
    $('#samples').innerHTML = SAMPLES.map(s => `<button type="button" class="sample" data-sample="${s.key}" aria-pressed="false"><span>${esc(t(s.name))}</span></button>`).join('');
    SAMPLES.forEach(s => { const b = $(`[data-sample="${s.key}"]`); if (b && s.canvas) b.prepend(s.canvas); });
    if (st.samplesDone || started) return;
    let i = 0;
    const next = () => {
      if (i >= SAMPLES.length) { st.samplesDone = true; return; }
      const s = SAMPLES[i++];
      try {
        s.canvas = PHOTOS.toCanvas(s.key, 448);
        const b = $(`[data-sample="${s.key}"]`);
        if (b) b.prepend(s.canvas);
      } catch (e) { console.error(e); }
      setTimeout(next, 16);
    };
    setTimeout(next, 30);
  }
  function useSample(key) {
    const s = SAMPLES.find(x => x.key === key);
    if (!s) return;
    if (!s.canvas) s.canvas = PHOTOS.toCanvas(s.key, 448);
    $$('#samples .sample').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.sample === key)));
    const c = document.createElement('canvas'); c.width = s.canvas.width; c.height = s.canvas.height;
    c.getContext('2d').drawImage(s.canvas, 0, 0);
    analyze(c, { source: 'sample', sample: key, sampleCat: s.cat, w: c.width, h: c.height });
  }

  async function publish() {
    const r = st.result;
    if (!r) return;
    const d = draftData();
    if (isAdmin() && !d.sellerId) { toast(t('bindChooseFirst'), 'alert'); $('#lSellerId').focus(); return; }
    if (d.lead === 'custom' && d.leadText.length < 3) { toast(t('err_lead_text_required'), 'alert'); $('#lLeadText').focus(); return; }
    const src = $('#cvPreview'), k = Math.min(1, 560 / Math.max(src.width, src.height));
    const out = document.createElement('canvas'); out.width = Math.round(src.width * k); out.height = Math.round(src.height * k);
    out.getContext('2d').drawImage(src, 0, 0, out.width, out.height);
    const image = out.toDataURL('image/jpeg', 0.84);
    const btn = $('#publish');
    btn.disabled = true;
    try {
      const body = {
        name: d.name, nameMr: d.nameMr, cat: d.cat, price: d.price,
        unit: I18N.en.unitPiece, unitMr: I18N.mr.unitPiece, desc: I18N.en['blurb_' + d.cat], descMr: I18N.mr['blurb_' + d.cat],
        lead: d.lead, photo: image,
        ai: { top: (r.preds || []).slice(0, 3).map(x => ({ className: x.className, probability: x.probability })), readiness: Math.round(r.ready.score * 100), model: st.version || '' }
      };
      if (d.lead === 'custom') Object.assign(body, { leadText: d.leadText, leadTextMr: d.leadTextMr });
      if (isAdmin()) body.sellerId = d.sellerId;   // a seller's listing is always her own shop: the server decides
      const res = await API.call('POST', '/listings', body);
      const p = res.product, live = res.status === 'active';
      state.metrics.published++;
      st.published = p.id;
      toast(t(live ? 'published' : 'listingPending', { name: L(p.name) }), live ? 'store' : 'clock', 5200);
      const note = $('#pubNote');
      note.hidden = false;
      note.className = 'pub-note ' + (live ? 'ok' : 'wait');
      note.innerHTML = live ? `${icon('check')}<span>${esc(t('pubLive', { name: L(p.name) }))}</span><a href="${esc(shopUrl('?p=' + encodeURIComponent(p.id)))}" target="_blank" rel="noopener">${esc(t('pubView'))}</a>`
        : `${icon('clock')}<span>${esc(t('pubWait', { name: L(p.name) }))}</span>`;
      CTX.changed('product', p);
      BUS.emit('metrics');
    } catch (e) {
      toast(errText(e), 'alert', 5200);
      btn.disabled = false;
    }
  }

  function bind() {
    document.addEventListener('securitypolicyviolation', (e) => {
      if (/tfhub|kaggle|storage\.googleapis/.test(e.blockedURI || '')) st.blocked = true;
    });
    $('#file').addEventListener('change', e => { loadFile(e.target.files[0]); e.target.value = ''; });
    $('#changePhoto').addEventListener('click', () => $('#file').click());
    $('#cnnRetry').addEventListener('click', () => { st.failed = false; load(); });
    const drop = $('#drop');
    ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
    drop.addEventListener('drop', e => { const f = e.dataTransfer && e.dataTransfer.files[0]; if (f) loadFile(f); });
    $('#samples').addEventListener('click', e => { const b = e.target.closest('[data-sample]'); if (b) useSample(b.dataset.sample); });
    $('#catOverride').addEventListener('change', e => { if (!st.result) return; st.result.override = e.target.value || null; renderResults(); fillListing(false); });
    $('#listingCard').addEventListener('input', (e) => {
      if (!st.result) return;
      const id = e.target.id;
      if (id === 'lPrice') st.priceTouched = true;
      if (['lMat', 'lHrs', 'lTier'].includes(id)) renderPrice(false);
      if (id === 'lLead') { st.leadTouched = true; toggleCustomLead(); }
      updateText();
    });
    $('#listingCard').addEventListener('change', (e) => {
      if (e.target.id === 'lSellerId') { st.sellerId = e.target.value; if (st.result) updateText(); }
      if (e.target.id === 'lLead' || e.target.id === 'lTier') { if (e.target.id === 'lLead') { st.leadTouched = true; toggleCustomLead(); } else renderPrice(false); if (st.result) updateText(); }
    });
    $('#useMlp').addEventListener('click', () => { renderPrice(true); updateText(); });
    $('#publish').addEventListener('click', publish);
    $('#copyListing').addEventListener('click', () => copyText($('#lTextEn').value + '\n\n' + $('#lTextMr').value));
    $('#shareListing').addEventListener('click', (e) => { if (!st.result) { e.preventDefault(); toast(t('predEmpty'), 'info'); } });
    BUS.on('tab', (tab) => { if (tab === 'catalogue') { if (!st.samplesDone) renderSamples(); if (!st.ready && !st.loading && !st.failed) load(); } });
    BUS.on('me', () => { renderBind(); if (st.result) updateText(); });
    BUS.on('sellers', () => { renderBind(); });
    BUS.on('settings', () => { if (st.result) updateText(); });
    BUS.on('lang', () => {
      const pressed = $('#samples [aria-pressed="true"]');
      if (st.samplesStarted) renderSamples();
      if (pressed) { const b = $(`[data-sample="${pressed.dataset.sample}"]`); if (b) b.setAttribute('aria-pressed', 'true'); }
      if (st.ready) status('ok', t('cnnReady', { v: st.version, b: ML.pick('webgl') }));
      else if (st.loading) status('busy', t('cnnLoading'));
      else if (st.failed) status('err', t(st.reason || 'cnnFail'));
      else status('', t('cnnIdle'));
      renderResults(); renderBind(); renderLeadSelect();
      if (st.result) { renderPrice(false); updateText(); }
    });
    BUS.on('model', () => { if (st.result) { renderPrice(false); updateText(); } });
  }
  function init() { renderBind(); renderLeadSelect(); renderResults(); renderPrice(false); }
  return { bind, init, load, renderResults, get ready() { return st.ready; } };
})();

/* ------------------------------------------------------------------
   Voice lessons: Marathi/English lessons read aloud (Web Speech API),
   the seller's local Saheli on WhatsApp (official SheSell number), and
   a nudge to share her own shop link once lesson 1 is done.
------------------------------------------------------------------- */
const SAHELI = (() => {
  const MODS = [
    { id: 'catalogue', icon: 'camera', title: 'modCat', steps: ['c1', 'c2', 'c3', 'c4', 'c5'] },
    { id: 'price', icon: 'rupee', title: 'modPrice', steps: ['p1', 'p2', 'p3', 'p4', 'p5'] },
    { id: 'upi', icon: 'qr', title: 'modUpi', steps: ['u1', 'u2', 'u3', 'u4', 'u5'] }
  ];
  const st = { mod: 0, step: 0, seen: {}, done: new Set(), token: 0, playing: false, posted: new Set() };
  MODS.forEach(m => { st.seen[m.id] = new Set([0]); });
  const hasTTS = () => 'speechSynthesis' in window && typeof window.SpeechSynthesisUtterance === 'function';
  const voices = () => { try { return window.speechSynthesis.getVoices() || []; } catch (e) { return []; } };
  function pickVoice(lang) {
    const vs = voices();
    if (lang === 'mr') return { v: vs.find(v => /^mr/i.test(v.lang)) || vs.find(v => /^hi/i.test(v.lang)) || null, native: !!vs.find(v => /^mr/i.test(v.lang)) };
    return { v: vs.find(v => /^en[-_]IN/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null, native: true };
  }
  const sentences = (text) => (text.match(/[^.!?।]+[.!?।]*/g) || [text]).map(s => s.trim()).filter(Boolean);

  function speak(text, lang, hooks = {}) {
    if (!hasTTS()) { toast(t('ttsNone'), 'alert'); if (hooks.onEnd) hooks.onEnd(false); return; }
    const synth = window.speechSynthesis;
    synth.cancel();
    const token = ++st.token, parts = sentences(text), { v } = pickVoice(lang);
    let i = 0;
    const next = () => {
      if (token !== st.token) return;
      if (i >= parts.length) { if (hooks.onEnd) hooks.onEnd(true); return; }
      const u = new SpeechSynthesisUtterance(parts[i]);
      if (v) u.voice = v;
      u.lang = v ? v.lang : (lang === 'mr' ? 'mr-IN' : 'en-IN');
      u.rate = Number($('#ttsRate').value) || 0.95;
      const idx = i;
      u.onstart = () => { if (token === st.token && hooks.onSentence) hooks.onSentence(idx); };
      u.onend = () => { i++; next(); };
      u.onerror = (e) => { if (e.error === 'interrupted' || e.error === 'canceled') return; i++; next(); };
      synth.speak(u);
    };
    setTimeout(next, 80);
  }
  function stop() {
    st.token++; st.playing = false;
    try { window.speechSynthesis.cancel(); } catch (e) { /* no tts */ }
    $$('.voice.playing').forEach(v => v.classList.remove('playing'));
    $$('#stepText .spoken').forEach(s => s.classList.remove('spoken'));
    setPlayBtn(false);
  }
  function speakText(text, lang, el) {
    const was = el && el.classList.contains('playing');
    stop();
    if (was) return;
    if (el) el.classList.add('playing');
    speak(text, lang, { onEnd: () => { if (el) el.classList.remove('playing'); } });
  }

  const mod = () => MODS[st.mod];
  // {w}: the collective's fair-wage target from the console settings
  const stepText = (m, i, lang = state.lang) => ((I18N[lang] && I18N[lang]['ls_' + m.id + '_' + m.steps[i]]) || I18N.en['ls_' + m.id + '_' + m.steps[i]])
    .replace(/\{w\}/g, () => new Intl.NumberFormat(lang === 'mr' ? 'mr-IN' : 'en-IN').format(CONFIG.fairWage));
  function renderModules() {
    $('#modules').innerHTML = MODS.map((m, i) => {
      const seen = st.seen[m.id].size, done = st.done.has(m.id);
      return `<button type="button" class="module" data-mod="${i}" aria-pressed="${i === st.mod}"><span class="ic">${icon(done ? 'check' : m.icon)}</span>
        <span><b class="h3">${esc(t(m.title))}</b><br><span class="tiny muted">${esc(done ? t('lessonDone') : t('stepsSeen', { a: fmtNum(seen), b: fmtNum(m.steps.length) }))}</span>
        <span class="meter"><i style="width:${(done ? 1 : seen / m.steps.length) * 100}%"></i></span></span></button>`;
    }).join('');
  }
  function renderLesson() {
    const m = mod();
    $('#lessonTitle').textContent = t(m.title);
    $('#lessonImg').src = [AVATARS.saheli, AVATARS.guide, AVATARS.mom][st.mod] || AVATARS.saheli;
    $('#dots').innerHTML = m.steps.map((_, i) => `<button type="button" data-step="${i}" ${i === st.step ? 'aria-current="step"' : ''} class="${st.seen[m.id].has(i) ? 'seen' : ''}" aria-label="${esc(t('stepN', { n: fmtNum(i + 1) }))}">${esc(fmtNum(i + 1))}</button>`).join('');
    $('#stepText').innerHTML = sentences(stepText(m, st.step)).map((s, i) => `<span data-s="${i}">${esc(s)}</span>`).join(' ');
    $('#prevStep').disabled = st.step === 0;
    $('#nextStep').disabled = st.step === m.steps.length - 1;
    $('#markDone').disabled = st.done.has(m.id);
  }
  function renderVoiceInfo() {
    const info = $('#voiceInfo'), note = $('#voiceNote');
    if (!hasTTS()) { info.textContent = t('ttsNone'); note.textContent = ''; return; }
    const { v, native } = pickVoice(state.lang);
    if (!voices().length) { info.textContent = t('ttsLoading'); note.textContent = ''; return; }
    info.textContent = v ? t('ttsVoice', { v: v.name, l: v.lang }) : t('ttsDefault');
    note.textContent = state.lang === 'mr' && !native ? t('ttsHindiNote') : '';
  }
  function setPlayBtn(on) {
    st.playing = on;
    $('#playAll').innerHTML = icon(on ? 'pause' : 'play') + `<span>${esc(on ? t('stop') : t('playAll'))}</span>`;
  }
  function highlight(i) {
    $$('#stepText [data-s]').forEach(s => s.classList.toggle('spoken', Number(s.dataset.s) === i));
  }
  function go(step) {
    const m = mod();
    st.step = clamp(step, 0, m.steps.length - 1);
    st.seen[m.id].add(st.step);
    renderLesson(); renderModules();
  }
  function listen(chain) {
    const m = mod();
    speak(stepText(m, st.step), state.lang, {
      onSentence: highlight,
      onEnd: (ok) => {
        highlight(-1);
        if (chain && ok && st.playing && st.step < m.steps.length - 1) { go(st.step + 1); listen(true); }
        else if (chain) setPlayBtn(false);
      }
    });
  }

  // lessons already completed on this account (the server keeps them for sellers)
  function setDone(list) { (list || []).forEach(id => { if (MODS.some(m => m.id === id)) { st.done.add(id); MODS.find(m => m.id === id).steps.forEach((_, i) => st.seen[id].add(i)); } }); renderModules(); renderLesson(); }
  function renderPractice() { $('#practiceCard').hidden = isAdmin(); }
  const askLink = () => waLink(t('askSaheliMsg', { name: mySeller() ? mySeller().name : (CTX.me ? CTX.me.name : '') }));

  function bind() {
    $('#modules').addEventListener('click', e => { const b = e.target.closest('[data-mod]'); if (!b) return; stop(); st.mod = Number(b.dataset.mod); st.step = 0; go(0); });
    $('#dots').addEventListener('click', e => { const b = e.target.closest('[data-step]'); if (!b) return; stop(); go(Number(b.dataset.step)); });
    $('#prevStep').addEventListener('click', () => { stop(); go(st.step - 1); });
    $('#nextStep').addEventListener('click', () => { stop(); go(st.step + 1); });
    $('#speak').addEventListener('click', () => { stop(); listen(false); });
    $('#playAll').addEventListener('click', () => {
      if (st.playing) { stop(); return; }
      stop(); setPlayBtn(true); listen(true);
    });
    $('#markDone').addEventListener('click', () => {
      const m = mod();
      st.done.add(m.id); m.steps.forEach((_, i) => st.seen[m.id].add(i));
      if (!state.metrics.lessons.has(m.id)) {
        API.track('lesson', null, m.id);
        if (!isAdmin()) API.call('POST', '/my/lessons/' + m.id, {}).then(() => CTX.changed('lesson', m.id)).catch(() => { /* counted locally anyway */ });
      }
      state.metrics.lessons.add(m.id);
      renderModules(); renderLesson(); BUS.emit('metrics');
      toast(t('lessonToast', { title: t(m.title) }), 'check');
    });
    $('#shareShop').addEventListener('click', () => CTX.share());
    const ask = () => { $('#askSaheli').href = askLink(); };
    ask();
    if (hasTTS()) { try { window.speechSynthesis.onvoiceschanged = renderVoiceInfo; } catch (e) { /* ignore */ } }
    BUS.on('lang', () => { stop(); renderModules(); renderLesson(); renderVoiceInfo(); ask(); });
    BUS.on('settings', () => { ask(); renderLesson(); });
    BUS.on('me', () => { ask(); renderPractice(); });
    BUS.on('tab', (tab) => { if (tab !== 'lessons') stop(); else renderVoiceInfo(); });
  }
  function init() {
    $('#saheliImg').src = AVATARS.guide;
    renderModules(); renderLesson(); renderVoiceInfo(); renderPractice();
  }
  return { bind, init, speakText, stop, setDone };
})();

/* ------------------------------------------------------------------
   Pilot impact dashboard (admin only): the deck's national figures, the
   live catalogue mix, the six pilot metrics counted from the server,
   and the 3-month roadmap for rural Pune and its neighbouring districts.
------------------------------------------------------------------- */
const DASH = (() => {
  let lfpr = null;
  const prev = {};
  const ROAD = [['m1', 'r1'], ['m1', 'r2'], ['m2', 'r3'], ['m2', 'r4'], ['m3', 'r5'], ['m3', 'r6']];

  function chart() {
    if (!libs.chart()) { const c = $('#lfprChart'); if (c) c.replaceWith(Object.assign(document.createElement('p'), { className: 'small muted', textContent: t('noChartLib') })); return; }
    const valueLabels = {
      id: 'valueLabels',
      afterDatasetsDraw(ch) {
        const { ctx } = ch, meta = ch.getDatasetMeta(0);
        ctx.save(); ctx.font = '800 15px Mukta, system-ui, sans-serif'; ctx.fillStyle = '#0F2A31'; ctx.textAlign = 'center';
        meta.data.forEach((bar, i) => ctx.fillText(fmtNum(ch.data.datasets[0].data[i], 1) + '%', bar.x, bar.y - 8));
        ctx.restore();
      }
    };
    const data = { labels: [t('yA'), t('yB')], datasets: [{ label: t('lfprLabel'), data: [23.3, 40], backgroundColor: ['#8FB0B6', '#9EB83B'], borderRadius: { topLeft: 4, topRight: 4 }, borderSkipped: 'bottom', maxBarThickness: 64 }] };
    if (lfpr) { lfpr.data.labels = [t('yA'), t('yB')]; lfpr.data.datasets[0].label = t('lfprLabel'); lfpr.options.locale = locale(); lfpr.update('none'); return; }
    lfpr = new Chart($('#lfprChart'), {
      type: 'bar', data, plugins: [valueLabels],
      options: {
        animation: false, responsive: true, maintainAspectRatio: false, locale: locale(), layout: { padding: { top: 24 } },
        scales: {
          x: { grid: { display: false }, ticks: { color: '#44575C', font: { family: 'Mukta', size: 14, weight: '600' } }, border: { color: '#C9D4BD' } },
          y: { beginAtZero: true, max: 50, ticks: { color: '#64767A', stepSize: 10, callback: v => fmtNum(v) + '%' }, grid: { color: '#E6ECDA' }, border: { display: false } }
        },
        plugins: { legend: { display: false }, tooltip: { backgroundColor: '#0F2A31', callbacks: { label: c => fmtNum(c.parsed.y, 1) + '%' } } }
      }
    });
  }
  const live = () => state.products.filter(p => !p.status || p.status === 'active');
  function renderSplit() {
    const list = live(), n = list.length || 1;
    $('#split').innerHTML = CAT_KEYS.map(c => {
      const share = list.filter(p => p.cat === c).length / n;
      return `<div class="split-row"><span>${esc(catName(c))}</span><span class="two"><i style="width:${(share * 100).toFixed(1)}%;background:#9EB83B"></i><i style="width:25%;background:#8FB0B6"></i></span><b class="num">${pct(share)}</b></div>`;
    }).join('');
  }
  function renderLive() {
    const s = state.stats, up = state.metrics.uplift;
    if (!s) { $('#liveMetrics').innerHTML = `<p class="small muted">${esc(t('lmLoading'))}</p>`; return; }
    const items = [
      ['sellers', fmtNum(s.sellers), t('lmSellers'), t('lmSellersSub', { shg: fmtNum(s.shg), target: fmtNum(30) }), Math.min(1, s.sellers / 30)],
      ['products', fmtNum(s.products), t('lmProducts'), t('lmProductsLive', { n: fmtNum(s.published) })],
      ['orders', fmtNum(s.orders), t('lmOrders'), t('lmOrdersLive')],
      ['deliv', fmtNum(s.delivered), t('lmDelivered'), s.orders ? t('lmRate', { p: pct(s.delivered / s.orders) }) : t('lmNone')],
      ['engage', fmtNum(s.views + s.shares + s.adds), t('lmEngage'), t('lmEngageSub', { v: fmtNum(s.views), s: fmtNum(s.shares), a: fmtNum(s.adds) })],
      ['income', up === null || up === undefined ? '—' : '+' + pct(up), t('lmIncome'), up === null || up === undefined ? t('lmIncomeWait') : t('lmIncomeSub')]
    ];
    $('#liveMetrics').innerHTML = items.map(([k, v, l, sub, meter]) => `<div class="lm${prev[k] !== undefined && prev[k] !== v ? ' flash' : ''}" data-k="${k}"><b>${esc(v)}</b><span>${esc(l)}</span><span class="tiny muted">${esc(sub)}</span>${meter !== undefined ? `<span class="meter" style="margin-top:6px"><i style="width:${(meter * 100).toFixed(0)}%"></i></span>` : ''}</div>`).join('');
    items.forEach(([k, v]) => { prev[k] = v; });
    setTimeout(() => $$('#liveMetrics .flash').forEach(el => el.classList.remove('flash')), 900);
  }
  function renderRoad() {
    $('#roadmap').innerHTML = ROAD.map(([mk, rk], i) => `<div class="road"><span class="m">${esc(t(mk))} · ${esc(fmtNum(i + 1))}</span><b>${esc(t(rk))}</b></div>`).join('');
  }
  function renderAll() { renderSplit(); renderLive(); renderRoad(); }
  function bind() {
    BUS.on('metrics', renderLive);
    BUS.on('stats', renderLive);
    BUS.on('catalog', () => { renderSplit(); renderLive(); });
    BUS.on('lang', () => { renderAll(); if (lfpr) chart(); });
  }
  return { bind, init: renderAll, chart };
})();

/* ------------------------------------------------------------------
   Mount. The console calls SheSellWorkspace.open(view, ctx) to show a
   workspace view in its main area (after sign-in), and hide() when it
   moves to one of its own views. Roles are checked here for the UI and
   again by the server on every API call.
     studio, catalogue, lessons   sellers and the admin
     impact                       the admin only
------------------------------------------------------------------- */
window.SheSellWorkspace = (() => {
  const VIEWS = { studio: ['seller', 'admin'], catalogue: ['seller', 'admin'], lessons: ['seller', 'admin'], impact: ['admin'] };
  const started = {};
  let built = false, current = null;

  function build(host) {
    ROOT = host.shadowRoot || host.attachShadow({ mode: 'open' });
    ROOT.innerHTML = `<style>${WS_CSS}</style>${WS_HTML}`;
    applyI18n();
    [STUDIO, CATALOGUE, SAHELI, DASH].forEach(p => { try { p.bind(); } catch (e) { console.error(e); } });
    [() => STUDIO.init(), () => CATALOGUE.init(), () => SAHELI.init(), () => DASH.init()].forEach(f => { try { f(); } catch (e) { console.error(e); } });
    built = true;
  }
  function applySettings(s) {
    if (!s) return;
    ['upiId', 'upiName', 'whatsappNumber', 'deliveryFee', 'freeDeliveryAbove', 'fairWage'].forEach(k => { if (s[k] !== undefined) CONFIG[k] = s[k]; });
    if (built) { renderWaHints(); BUS.emit('settings'); }
  }
  function update(ctx) {
    const meChanged = ctx.me !== undefined && JSON.stringify(ctx.me) !== JSON.stringify(CTX.me);
    Object.assign(CTX, ctx);
    if (ctx.settings) applySettings(ctx.settings);
    if (ctx.lang && ctx.lang !== state.lang) { state.lang = ctx.lang; if (built) { applyI18n(); BUS.emit('lang', state.lang); } }
    if (meChanged && built) BUS.emit('me');
  }

  // libraries and server data each view needs, fetched once (retried if it failed)
  const once = (key, fn) => started[key] || (started[key] = fn().catch(e => { delete started[key]; throw e; }));
  const startStudio = () => once('studio', async () => {
    const [data] = await Promise.all([API.call('GET', '/ml/training-data'), LOADER.need('chart').catch(() => {}), LOADER.need('tf').catch(() => {})]);
    STUDIO.setData(data);
    if (libs.tf()) { try { await tf.ready(); } catch (e) { console.warn(e); } }
    STUDIO.startTraining();
  });
  async function refreshImpact() {
    try {
      const [s, p] = await Promise.all([API.call('GET', '/stats'), API.call('GET', '/my/products')]);
      state.stats = s.stats; state.products = p.products;
      BUS.emit('catalog'); BUS.emit('stats');
    } catch (e) { if (e.status !== 401) toast(errText(e), 'alert'); }
  }
  function prepare(view) {
    // the AI Catalogue prices drafts with the Studio's MLP, so both start the price model
    if (view === 'studio' || view === 'catalogue') startStudio().catch(e => toast(errText(e), 'alert'));
    if (view === 'catalogue' && isAdmin()) once('sellers', async () => { state.sellers = (await API.call('GET', '/admin/sellers')).sellers; BUS.emit('sellers'); }).catch(() => {});
    if (view === 'lessons' && !isAdmin()) once('lessons', async () => {
      const r = await API.call('GET', '/my/profile');
      SAHELI.setDone(((r.seller && r.seller.lessonsDone) || []).map(x => x.module));
    }).catch(() => {});
    if (view === 'impact') {
      once('impactChart', () => LOADER.need('chart').then(() => DASH.chart())).catch(() => DASH.chart());
      refreshImpact();
    }
  }

  function open(view, ctx) {
    if (!VIEWS[view] || !ctx || !ctx.me || !VIEWS[view].includes(ctx.me.role)) return false;
    update(ctx);
    if (!built) build(ctx.host);
    $$('.ws-view').forEach(v => { v.hidden = v.dataset.view !== view; });
    current = view;
    BUS.emit('tab', view);
    prepare(view);
    return true;
  }
  function hide() { if (current) { current = null; BUS.emit('tab', null); } }

  // live events, forwarded from the console's own event stream
  function event(type, data) {
    if (!built) return;
    if (type === 'training' && started.studio) API.call('GET', '/ml/training-data').then(d => STUDIO.setData(d, { announce: true })).catch(() => {});
    if (type === 'settings') applySettings(data);
    if (type === 'stats' && isAdmin()) { state.stats = data; BUS.emit('stats'); }
    if (type === 'product' && isAdmin() && state.products.length) {
      const i = state.products.findIndex(p => p.id === (data.product ? data.product.id : data.id));
      if (data.action === 'remove') { if (i >= 0) state.products.splice(i, 1); }
      else if (data.product && data.product.status !== undefined) { if (i >= 0) state.products[i] = data.product; else state.products.unshift(data.product); }
      BUS.emit('catalog');
    }
  }
  function reset() { Object.keys(started).forEach(k => delete started[k]); state.sellers = []; state.stats = null; state.products = []; }

  return { open, hide, update, event, reset, views: VIEWS, get current() { return current; } };
})();

})();

/* ---------- i18n + formatting ---------- */
function t(key, vars) {
  let s = (CI18N[S.lang] && CI18N[S.lang][key]) ?? CI18N.en[key] ?? key;
  if (vars) s = s.replace(/\{(\w+)\}/g, (_, k) => (vars[k] ?? ''));

}
const tl = (lang, key, vars) => { let s = (CI18N[lang] || CI18N.en)[key] ?? CI18N.en[key] ?? key; if (vars) s = s.replace(/\{(\w+)\}/g, (_, k) => (vars[k] ?? '')); return s; };
const loc = () => (S.lang === 'mr' ? 'mr-IN' : 'en-IN');
const num = (n, d = 0) => { try { return new Intl.NumberFormat(loc(), { maximumFractionDigits: d, minimumFractionDigits: d }).format(n); } catch (e) { return Number(n).toFixed(d); } };
const inr = (n) => '₹' + num(Math.round(n || 0));

const dateStr = (ts, opts = { day: 'numeric', month: 'short' }) => new Date(ts).toLocaleDateString(loc(), opts);
const monthName = (i) => new Date(2026, i, 1).toLocaleDateString(loc(), { month: 'short' });
const timeStr = (ts) => new Date(ts).toLocaleString(loc(), { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
function ago(ts) {
  const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
  if (s < 50) return t('justNow');
  const m = Math.round(s / 60); if (m < 60) return t('minAgo', { n: num(m) });
  const h = Math.round(m / 60); if (h < 24) return t('hAgo', { n: num(h) });
  const d = Math.round(h / 24); if (d < 7) return t('dAgo', { n: num(d) });
  return dateStr(ts);
}

function errText(e) {
  if (!e) return t('netError');

/* ---------- API ---------- */
async function api(method, path, body) {
  let res;
  try {
    res = await fetch('/api' + path, { method, credentials: 'same-origin', headers: body !== undefined ? { 'Content-Type': 'application/json' } : {}, body: body !== undefined ? JSON.stringify(body) : undefined });
  } catch (e) { const err = new Error(t('netError')); err.code = 'network'; throw err; }
  let data = {};
  try { data = await res.json(); } catch (e) { /* empty body */ }
  if (res.status === 401 && path !== '/auth/login' && path !== '/auth/password') { S.me = null; showLogin(); }
  if (!res.ok) {
    const err = new Error((data.error && data.error.message) || t('netError'));
    err.status = res.status; err.code = data.error && data.error.code; err.info = data.error || {};
    err.message = errText(err);
    throw err;
  }
  return data;
}

/* ---------- toasts, dialogs, drawer ---------- */
function toast(msg, kind = 'ok', ms = 3600) {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = icon(kind === 'err' ? 'alert' : kind === 'info' ? 'bell' : 'check') + '<span></span>';
  el.querySelector('span').textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, ms);
}
function dialog({ title, body = '', ok = t('ok'), cancel = t('cancel'), danger = false, input = null, onOpen = null }) {
  return new Promise(resolve => {
    const d = $('#dialog');
    d.innerHTML = `<form class="dlg" method="dialog">
      <h2 class="h2">${esc(title)}</h2>${body ? `<div class="dlg-body">${body}</div>` : ''}
      ${input ? `<label class="field"><span class="label">${esc(input.label)}</span><input class="input" id="dlgInput" autocomplete="off" placeholder="${esc(input.placeholder || '')}"></label>` : ''}
      <div class="dlg-actions">${cancel ? `<button type="button" class="btn ghost" data-v="0">${esc(cancel)}</button>` : ''}<button type="submit" class="btn ${danger ? 'danger' : 'teal'}" data-v="1">${esc(ok)}</button></div></form>`;
    d.hidden = false; $('#scrim').hidden = false;
    const done = (v) => { d.hidden = true; if ($('#drawer').hidden) $('#scrim').hidden = true; resolve(v); };
    d.querySelector('form').addEventListener('submit', (e) => { e.preventDefault(); done(input ? ($('#dlgInput').value || '') : true); });
    d.querySelector('[data-v="0"]')?.addEventListener('click', () => done(input ? null : false));
    if (onOpen) onOpen(d);
    setTimeout(() => (input ? $('#dlgInput') : d.querySelector('[data-v="1"]')).focus(), 30);
  });
}
function openDrawer(html, wide = false) {
  const d = $('#drawer');

// resize a picked photo to a JPEG data URL (max 900 px), like the storefront's AI Catalogue does
function photoToDataUrl(file, max = 900) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) { reject(new Error(t('photoType'))); return; }
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(t('photoType'))); };
    img.src = url;
  });
}

/* ---------- live updates ---------- */
function connectLive() {
  if (S.es) S.es.close();
  if (typeof EventSource === 'undefined') return;
  const es = new EventSource('/api/stream');
  S.es = es;
  es.addEventListener('hello', () => setLive(true));
  es.onerror = () => setLive(false);
  const on = (type, fn) => es.addEventListener(type, (ev) => { let d; try { d = JSON.parse(ev.data); } catch (e) { return; } try { fn(d); } catch (err) { console.error(type, err); } });
  on('order', (d) => LIVE.order(d));
  on('product', (d) => LIVE.product(d));
  on('notice', (d) => LIVE.notice(d));
  on('stats', (d) => LIVE.stats(d));
  on('settings', (d) => { S.settings = d; if (window.SheSellWorkspace) SheSellWorkspace.event('settings', d); if (S.view === 'settings') renderView(); });
  on('training', (d) => { if (window.SheSellWorkspace) SheSellWorkspace.event('training', d); if (S.view === 'training') renderView(); });
  on('reload', () => { toast(t('dataReloaded'), 'info'); setTimeout(() => location.reload(), 900); });
}
function setLive(v) {
  S.live = v;
  const el = $('#liveDot');
  el.className = 'live-dot ' + (v ? 'on' : 'off');
  el.innerHTML = `<i></i><span>${esc(t(v ? 'liveOn' : 'liveOff'))}</span>`;
}
function pushFeed(item) {
  S.feed.unshift(Object.assign({ at: Date.now() }, item));
  S.feed = S.feed.slice(0, 30);
  if (S.view === 'dashboard') VIEWS.renderFeed();
}

      `${shadow(84, 70, 20, 4)}<circle cx="80" cy="54" r="21" fill="#B3263A"/><circle cx="80" cy="54" r="16.5" fill="#F3E2C6"/>` +
      Array.from({ length: 19 }, (_, i) => { const a = i * 2.4, d = 3 + (i % 5) * 2.6; return `<circle cx="${(80 + Math.cos(a) * d).toFixed(1)}" cy="${(54 + Math.sin(a) * d).toFixed(1)}" r="2.6" fill="#D43349"/>`; }).join('') +
      `<path d="M112 40q10-12 22-4q-12 8-22 4z" fill="${C.leaf}"/>`,
    jaggery: () => `${shadow(80, 104, 50)}<path d="M24 96q56 -30 112 0q-56 18 -112 0z" fill="#5E9A43"/>` +
      [[52, 74], [80, 70], [108, 74], [66, 56], [94, 56]].map(([x, y]) => `<path d="M${x - 13} ${y}l13-7l13 7v14l-13 7l-13-7z" fill="#9B5B23"/><path d="M${x - 13} ${y}l13 7l13-7l-13-7z" fill="#C07A35"/><path d="M${x} ${y + 7}v14" stroke="#7E4519" stroke-width="1.5"/>`).join(''),
    banana: () => `${shadow(80, 104, 46)}` + [0, 1, 2, 3].map(i => {
        const ox = i * 9, oy = i * 5;
        return `<path d="M${106 - i * 2} ${40 + i * 2}Q${74 + ox} ${46 + oy} ${48 + ox} ${88 + oy}" fill="none" stroke="#B8901A" stroke-width="15" stroke-linecap="round"/><path d="M${106 - i * 2} ${40 + i * 2}Q${74 + ox} ${46 + oy} ${48 + ox} ${88 + oy}" fill="none" stroke="${['#F2CF3A', '#EBC12E', '#F5D650', '#E9BE2A'][i]}" stroke-width="12" stroke-linecap="round"/><circle cx="${48 + ox}" cy="${88 + oy}" r="3" fill="#5A4316"/>`;
      }).join('') + `<path d="M100 40q8-10 14-6" stroke="#6B4E1E" stroke-width="7" fill="none" stroke-linecap="round"/>`,
    rice: () => `${shadow(80, 108, 44)}<path d="M50 40q30-10 60 0l8 64q-38 8-76 0z" fill="#D7B98A"/><path d="M50 40q30 10 60 0" fill="none" stroke="#B49565" stroke-width="3"/><path d="M58 44l-6-12M104 44l6-12" stroke="#B49565" stroke-width="3"/>` +
      `<rect x="62" y="62" width="36" height="20" rx="3" fill="${C.teal}"/><path d="M68 72h24" stroke="#F5EEDC" stroke-width="2"/>` +
      Array.from({ length: 22 }, (_, i) => { const x = 108 + (i % 6) * 5 + (i * 7) % 3, y = 98 + Math.floor(i / 6) * 3.5; return `<ellipse cx="${x}" cy="${y}" rx="2.4" ry="1.1" fill="#FBF7EC" stroke="#D8CDAE" stroke-width=".6" transform="rotate(${(i * 37) % 180} ${x} ${y})"/>`; }).join('')
  };
  function svg(p, cls = '', fit = 'slice') {
    if (p.image) return `<img class="${cls} art-photo" src="${p.image}" alt="" loading="lazy"${fit === 'meet' ? ' style="object-fit:contain"' : ''}>`;
    const body = (draw[p.art] || draw.bag)();
    return `<svg class="${cls}" viewBox="0 0 160 120" role="img" aria-hidden="true" preserveAspectRatio="xMidYMid ${fit}"><rect width="160" height="120" fill="${BG[p.cat] || '#EEF2E6'}"/>${body}</svg>`;
  }
  return { svg, BG };
})();

/* ------------------------------------------------------------------
   SheSell Console views. Each view fetches what it needs, renders
   into #view, and patches itself when live events arrive.
------------------------------------------------------------------- */
const VIEWS = (() => {
  const FLOW = ['confirmed', 'packed', 'out', 'delivered'];
  const pageHead = (title, sub, actions = '') => `<div class="page-head"><div><h1 class="h1">${esc(title)}</h1>${sub ? `<p class="muted">${esc(sub)}</p>` : ''}</div>${actions ? `<div class="head-actions">${actions}</div>` : ''}</div>`;
  const chips = (id, list, current, counts = {}) => `<div class="chips" id="${id}" role="group">${list.map(f => `<button type="button" class="chip" data-f="${f}" aria-pressed="${current === f}">${esc(t(id + '_' + f))}${counts[f] ? ` <span class="cnt">${num(counts[f])}</span>` : ''}</button>`).join('')}</div>`;
  const field = (label, inner, hint = '') => `<label class="field"><span class="label">${esc(label)}</span>${inner}${hint ? `<small class="hint">${esc(hint)}</small>` : ''}</label>`;
  const compact = (v) => { try { return '₹' + new Intl.NumberFormat(loc(), { notation: 'compact', maximumFractionDigits: 1 }).format(v); } catch (e) { return inr(v); } };

  /* ======================= dashboard ======================= */
  let dashTimer = null;
  function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; }
  function barPath(x, y, w, h, r) { r = Math.min(r, h, w / 2); return h <= 0 ? '' : `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; }
  function salesChart(series) {
    // drawn at the card's real width so labels stay readable on phones
    const W = Math.round(Math.min(680, Math.max(300, ($('#view').clientWidth || 640) * (window.innerWidth > 1000 ? 0.5 : 1) - 70))), H = 230, P = { l: 52, r: 10, t: 14, b: 28 };
    const max = niceMax(Math.max(100, ...series.map(d => d.revenue)));
    const iw = W - P.l - P.r, ih = H - P.t - P.b, n = series.length, slot = iw / n, bw = Math.max(8, Math.min(24, slot * 0.58));
    const y = (v) => P.t + ih - (v / max) * ih;
    const grid = [0, 0.5, 1].map(f => `<line class="gl" x1="${P.l}" x2="${W - P.r}" y1="${y(max * f).toFixed(1)}" y2="${y(max * f).toFixed(1)}"/><text class="yl" x="${P.l - 8}" y="${(y(max * f) + 4).toFixed(1)}">${esc(compact(max * f))}</text>`).join('');
    const bars = series.map((d, i) => {
      const x = P.l + i * slot + (slot - bw) / 2, h = d.revenue ? Math.max(2, ih * d.revenue / max) : 0;
      return `<g class="bar" data-i="${i}"><rect class="hit" x="${(P.l + i * slot).toFixed(1)}" y="${P.t}" width="${slot.toFixed(1)}" height="${ih}"/><path d="${barPath(x, P.t + ih - h, bw, h, 4)}"/></g>`;
    }).join('');
    const every = W < 420 ? 3 : 2;
    const labels = series.map((d, i) => ((n - 1 - i) % every === 0 ? `<text class="xl" x="${(P.l + i * slot + slot / 2).toFixed(1)}" y="${H - 8}">${esc(i === n - 1 ? t('today') : dateStr(d.day))}</text>` : '')).join('');
    const table = `<details class="as-table"><summary>${esc(t('showTable'))}</summary><table class="tbl"><thead><tr><th>${esc(t('day'))}</th><th class="n">${esc(t('ordersWord'))}</th><th class="n">${esc(t('salesWord'))}</th></tr></thead><tbody>${series.map(d => `<tr><td>${esc(dateStr(d.day, { weekday: 'short', day: 'numeric', month: 'short' }))}</td><td class="n">${num(d.orders)}</td><td class="n">${inr(d.revenue)}</td></tr>`).join('')}</tbody></table></details>`;
    return `<div class="chart" data-series='${esc(JSON.stringify(series))}'><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('chartAria'))}">${grid}<line class="axis" x1="${P.l}" x2="${W - P.r}" y1="${P.t + ih}" y2="${P.t + ih}"/>${bars}${labels}</svg><div class="tip" hidden></div></div>${table}`;
  }
  function chartHover(e) {
    const chart = e.target.closest('.chart'); if (!chart) return;
    const tip = chart.querySelector('.tip'), g = e.target.closest('.bar');
    chart.querySelectorAll('.bar.on').forEach(b => b.classList.remove('on'));
    if (!g) { tip.hidden = true; return; }
    g.classList.add('on');
    const d = JSON.parse(chart.dataset.series)[Number(g.dataset.i)];
    tip.innerHTML = `<b>${esc(dateStr(d.day, { weekday: 'short', day: 'numeric', month: 'short' }))}</b><span>${esc(inr(d.revenue))} · ${esc(t('nOrders', { n: num(d.orders) }))}</span>`;
    const r = chart.getBoundingClientRect(), gr = g.getBoundingClientRect();
    tip.hidden = false;
    tip.style.left = Math.min(r.width - tip.offsetWidth - 4, Math.max(4, gr.left - r.left + gr.width / 2 - tip.offsetWidth / 2)) + 'px';
    tip.style.top = '4px';
  }
  function catBars(rows) {
    const max = Math.max(1, ...rows.map(r => r.revenue));
    return `<div class="cbars">${rows.map(r => `<div class="cbar"><span class="cl"><i style="background:${CAT_COLORS[r.cat]}"></i>${esc(catName(r.cat))}</span><span class="ct"><i style="width:${(r.revenue / max * 100).toFixed(1)}%;background:${CAT_COLORS[r.cat]}"></i></span><b>${esc(inr(r.revenue))}</b></div>`).join('')}</div>`;
  }
  function tile([ic, label, value, sub, link, trend]) {
    const tag = link ? 'button' : 'div';
    return `<${tag} ${link ? `type="button" data-link="${link}"` : ''} class="kpi">${icon(ic)}<span class="kl">${esc(label)}</span><b class="kpv">${esc(value)}</b><small class="${trend === undefined || trend === null ? '' : trend >= 0 ? 'up' : 'down'}">${esc(sub)}</small></${tag}>`;
  }
  function attention(k) {
    const items = isAdmin() ? [
      [k.claimed, 'clock', 'atClaimed', 'payments:claimed'], [k.toPack, 'bell', 'atToPack', 'orders:confirmed'],
      [k.pendingListings, 'tag', 'atListings', 'products:pending'], [k.unverified, 'users', 'atSellers', 'sellers:unverified'], [k.lowStock, 'alert', 'atLowStock', 'products:active']
    ] : [[k.toPack, 'bell', 'atToPackMine', 'orders:confirmed'], [k.pendingListings, 'tag', 'atMyListings', 'products:pending'], [k.lowStock, 'alert', 'atLowStock', 'products:active']];
    const open = items.filter(x => x[0] > 0);
    return open.length ? `<div class="att">${open.map(([n, ic, key, link]) => `<button type="button" class="att-item" data-link="${link}">${icon(ic)}<span>${esc(t(key))}</span><b class="cnt">${num(n)}</b></button>`).join('')}</div>`
      : empty(t('allClear'), 'check');
  }
  function feedHtml() {
    return S.feed.length ? `<ul class="feed">${S.feed.map(f => `<li>${icon(f.icon)}<span>${esc(f.text)}</span><small>${esc(ago(f.at))}</small></li>`).join('')}</ul>` : `<p class="muted small">${esc(t('feedEmpty'))}</p>`;
  }
  function renderFeed() { const el = $('#feed'); if (el) el.innerHTML = feedHtml(); }
  function engagement(s) {
    if (!s) return '';
    const parts = [['eye', 'enViews', s.views], ['share', 'enShares', s.shares], ['cart', 'enAdds', s.adds], ['book', 'enLessons', s.lessons], ['cpu', 'enTrain', s.trainings], ['camera', 'enScans', s.scans]];
    return `<div class="eng">${parts.map(([ic, k, v]) => `<div>${icon(ic)}<b>${num(v)}</b><small>${esc(t(k))}</small></div>`).join('')}</div>`;
  }

  /* ---------- WhatsApp-first distribution: a seller's (or SHG's) shop link, ready to forward ---------- */
  async function shopMessage(seller, lang) {
    let items = [];
    try {
      const list = isAdmin() ? (await api('GET', '/products')).products.filter(p => p.sellerId === seller.id) : (S.data.products || (S.data.products = (await api('GET', '/my/products')).products));
      items = list.filter(p => !p.status || p.status === 'active').slice(0, 8);
    } catch (e) { /* message without the product lines */ }
    const name = lang === 'mr' && seller.nameMr ? seller.nameMr : seller.name, place = lang === 'mr' && seller.placeMr ? seller.placeMr : seller.place;
    const lines = items.map(p => `• ${(p.name && (p.name[lang] || p.name.en)) || ''} · ₹${new Intl.NumberFormat(lang === 'mr' ? 'mr-IN' : 'en-IN').format(p.price)}${p.lead ? ' · ' + (p.lead === 'custom' && p.leadText ? (p.leadText[lang] || p.leadText.en) : tl(lang, 'lead_' + p.lead)) : ''}`).join('\n');
    return tl(lang, seller.type === 'shg' ? 'shopMsgShg' : 'shopMsg', { name, place, items: lines || tl(lang, 'shopMsgSoon'), link: shopLink(seller.id) });
  }
  async function shareShop(seller) {
    seller = seller || (S.me && S.me.seller);
    if (!seller) return;
    const msg = await shopMessage(seller, S.lang);
    await dialog({
      title: t(seller.type === 'shg' ? 'shareTitleShg' : 'shareTitle', { name: seller.name }),
      body: `<p class="wa-preview">${esc(msg)}</p>${waHint()}<p class="muted small">${esc(t('shareHow'))}</p>
        <div class="btn-row"><a class="btn wa" href="${esc(waOfficial(msg))}" target="_blank" rel="noopener">${icon('wa')}<span>${esc(t('shareSend'))}</span></a>
        <button type="button" class="btn ghost" data-copy-msg>${icon('copy')}<span>${esc(t('copyMsg'))}</span></button>
        <a class="btn ghost" href="${esc(shopLink(seller.id))}" target="_blank" rel="noopener">${icon('external')}<span>${esc(t('openShopPage'))}</span></a></div>`,
      ok: t('done'), cancel: null,
      onOpen: (d) => d.querySelector('[data-copy-msg]').addEventListener('click', () => copyText(msg))
    });
  }
  function shareCard() {
    const s = S.me && S.me.seller;
    if (!s) return '';
    return `<section class="card share-card"><div class="share-ic">${icon('wa')}</div>
      <div class="share-t"><h2 class="h2">${esc(t(s.type === 'shg' ? 'shareCardTitleShg' : 'shareCardTitle'))}</h2><p class="muted small">${esc(t('shareCardSub'))}</p>
        <code class="share-link">${esc(shopLink(s.id))}</code></div>
      <div class="btn-row"><button type="button" class="btn wa" data-share-shop>${icon('wa')}<span>${esc(t('shareShopBtn'))}</span></button></div></section>`;
  }
  function setupBanner(issues) {
    if (!issues || !issues.length) return '';
    return `<div class="setup-banner">${icon('alert')}<div><b>${esc(t('setupTitle'))}</b><ul>${issues.map(k => `<li>${esc(t('setup_' + k))}</li>`).join('')}</ul></div>
      ${S.view !== 'settings' ? `<button type="button" class="btn teal sm" data-link="settings">${icon('settings')}<span>${esc(t('setupFix'))}</span></button>` : ''}</div>`;
  }

  async function dashboard() {
    const v = $('#view');
    if (!S.data.overview) v.innerHTML = skeleton();
    const o = await api('GET', '/my/overview');
    S.data.overview = o;
    setBadges(o);
    if (S.view !== 'dashboard') return;
    const k = o.kpis, admin = isAdmin();
    const trend = k.revenuePrev7d ? (k.revenue7d - k.revenuePrev7d) / k.revenuePrev7d : null;
    const trendText = trend === null ? t('kNoPrev') : t('kVsPrev', { p: (trend >= 0 ? '+' : '−') + num(Math.abs(trend) * 100) + '%' });
    const tiles = admin ? [
      ['package', t('kOrdersToday'), num(k.ordersToday), t('kInTransit', { n: num(k.inTransit) }), 'orders:active'],
      ['rupee', t('kRevenue7'), inr(k.revenue7d), trendText, null, trend],
      ['bell', t('kToPack'), num(k.toPack), t('kToPackSub'), 'orders:confirmed'],
      ['clock', t('kClaimed'), num(k.claimed), t('kUnpaid', { v: inr(k.unpaid) }), 'payments:claimed'],
      ['tag', t('kPending'), num(k.pendingListings), t('kLiveN', { n: num(k.products) }), 'products:pending'],
      ['users', t('kSellers'), num(k.sellers), t('kUnverified', { n: num(k.unverified) }), 'sellers:unverified']
    ] : [
      ['package', t('kOrdersToday'), num(k.ordersToday), t('kInTransit', { n: num(k.inTransit) }), 'orders:active'],
      ['rupee', t('kMySales7'), inr(k.revenue7d), trendText, null, trend],
      ['bell', t('kToPack'), num(k.toPack), t('kToPackMine'), 'orders:confirmed'],
      ['tag', t('kLive'), num(k.products), k.pendingListings ? t('kWaiting', { n: num(k.pendingListings) }) : t('kAllLive'), 'products:all'],
      ['alert', t('kLowStock'), num(k.lowStock), t('kLowStockSub'), 'products:active']
    ];
    const name = (S.me.seller ? (S.lang === 'mr' && S.me.seller.nameMr) || S.me.seller.name : S.me.name);
    v.innerHTML = pageHead(t('hello', { name }), dateStr(Date.now(), { weekday: 'long', day: 'numeric', month: 'long' }), `<a class="btn ghost" href="/" target="_blank" rel="noopener">${icon('store')}<span>${esc(t('openShop'))}</span></a>`) +
      (S.me.seller && !S.me.seller.verified ? `<div class="note warn">${icon('shield')}<span>${esc(t('pendingVerify'))}</span></div>` : '') +
      (admin ? setupBanner(o.setup) : shareCard()) +
      `<div class="kpis" data-n="${tiles.length}">${tiles.map(tile).join('')}</div>
      <div class="grid2">
        <section class="card"><div class="card-h"><h2 class="h2">${esc(t(admin ? 'salesTitle' : 'mySalesTitle'))}</h2><small class="muted">${esc(t('last14'))}</small></div>${salesChart(o.series)}</section>
        <section class="card"><div class="card-h"><h2 class="h2">${esc(t('attentionTitle'))}</h2></div>${attention(k)}</section>
      </div>
      <div class="grid2">
        <section class="card"><div class="card-h"><h2 class="h2">${esc(t('recentTitle'))}</h2><button type="button" class="link" data-link="orders:all">${esc(t('seeAll'))}</button></div>
          ${o.recent.length ? `<div class="rows compact">${o.recent.map(orderRow).join('')}</div>` : empty(t('noOrders'), 'package')}</section>
        <section class="card"><div class="card-h"><h2 class="h2">${esc(t('feedTitle'))}</h2><span class="muted small">${icon('wifi')}</span></div><div id="feed">${feedHtml()}</div></section>
      </div>
      <div class="grid2">
        <section class="card"><div class="card-h"><h2 class="h2">${esc(t('byCatTitle'))}</h2><small class="muted">${esc(t('last30'))}</small></div>${catBars(o.byCategory)}</section>
        <section class="card"><div class="card-h"><h2 class="h2">${esc(t('topTitle'))}</h2><small class="muted">${esc(t('last30'))}</small></div>
          ${o.top.length ? `<ol class="toplist">${o.top.map(p => `<li><span>${esc(S.lang === 'mr' && p.nameMr ? p.nameMr : p.name)}</span><small>${esc(t('soldN', { n: num(p.qty) }))}</small><b>${esc(inr(p.revenue))}</b></li>`).join('')}</ol>` : empty(t('noSales'), 'chart')}</section>
      </div>
      ${admin ? `<section class="card"><div class="card-h"><h2 class="h2">${esc(t('engageTitle'))}</h2><small class="muted">${esc(t('engageSub'))}</small></div><div id="eng">${engagement(o.engagement)}</div></section>` : ''}`;
  }
  function refreshDashboard() { clearTimeout(dashTimer); dashTimer = setTimeout(() => { if (S.view === 'dashboard') dashboard().catch(() => {}); else refreshBadges(); }, 700); }

  /* ======================= orders ======================= */
  const ORDER_F = () => ['active', 'confirmed', 'packed', 'out', 'delivered', 'cancelled', 'all'];
  const myShare = (o) => o.items.filter(i => i.mine).reduce((s, i) => s + i.price * i.q, 0);
  function orderRow(o) {
    const share = !(isAdmin() || o.allMine), amount = share ? myShare(o) : o.total;
    // right-hand block: status + amount, then the payment state (the long "UPI claimed — pending verification" gets its own line)
    return `<button type="button" class="row ord" data-order="${esc(o.id)}">
      <span class="c-id"><b>${esc(o.id)}</b><small>${esc(ago(o.createdAt))}</small>${o.demo ? `<small class="demo">${esc(t('demoTag'))}</small>` : ''}</span>
      <span class="c-cust"><b>${esc(o.customer.name)}</b><small>${esc(o.customer.place || t('mode_' + o.mode))}</small></span>
      <span class="c-items"><small>${esc(o.items.map(i => L(i.name) + ' ×' + num(i.q)).join(', '))}</small></span>
      <span class="c-end"><span class="c-top">${statusPill(o.status)}<b>${esc(inr(amount))}</b></span><span class="c-pay">${payPill(o.payment)}${share ? `<small>${esc(t('yourItems'))}</small>` : ''}</span></span>
    </button>`;
  }
  async function orders() {
    const v = $('#view');
    if (!ORDER_F().includes(S.filters.orders)) S.filters.orders = 'active';
    v.innerHTML = pageHead(t('nav_orders'), t(isAdmin() ? 'ordersSubAdmin' : 'ordersSubSeller'),
      `<label class="search">${icon('search')}<input class="input" id="oq" type="search" placeholder="${esc(t('searchOrders'))}" value="${esc(S.q.orders)}" aria-label="${esc(t('searchOrders'))}"></label>`) +
      chips('of', ORDER_F(), S.filters.orders) + `<div id="oList">${skeleton()}</div>`;
    await loadOrders();
  }
  async function loadOrders() {
    const f = S.filters.orders;
    const res = await api('GET', `/my/orders?status=${f === 'all' ? '' : f}&q=${encodeURIComponent(S.q.orders)}`);
    S.data.orders = res.orders;
    renderOrderList();
  }
  function renderOrderList() {
    const el = $('#oList'); if (!el) return;
    const list = S.data.orders || [];
    el.innerHTML = list.length ? `<div class="rows">${list.map(orderRow).join('')}</div>` : empty(t('noOrders'), 'package');
  }
  function matchesOrderFilter(o) {
    const f = S.filters.orders, q = S.q.orders.toLowerCase();
    const okF = f === 'all' || (f === 'active' ? ['confirmed', 'packed', 'out'].includes(o.status) : o.status === f);
    const okQ = !q || [o.id, o.customer.name, o.customer.phone, o.customer.place].join(' ').toLowerCase().includes(q);
    return okF && okQ;
  }
  function orderDrawer(o) {
    const admin = isAdmin(), cur = FLOW.indexOf(o.status), cancelled = o.status === 'cancelled', closed = cancelled || o.status === 'delivered';
    const canStatus = admin || o.allMine;
    const next = cur >= 0 && cur < 3 ? FLOW[cur + 1] : null;
    const myUnpacked = !admin && o.items.some(i => i.mine && !i.packed);
    const notifyKey = cancelled ? 'nfCancelled' : o.payment === 'paid' && o.status === 'confirmed' ? 'nfPaid' : 'nf_' + o.status;
    const lang = o.lang === 'mr' ? 'mr' : 'en';
    const msg = tl(lang, notifyKey, { name: o.customer.name.split(' ')[0], id: o.id, total: '₹' + o.total });

  async function submitProduct(form) {
    const fd = new FormData(form), body = {};
    for (const [k, val] of fd.entries()) body[k] = typeof val === 'string' ? val.trim() : val;
    body.price = Number(body.price);
    body.stock = body.stock === '' ? null : Number(body.stock);
    if (body.lead !== 'custom') { delete body.leadText; delete body.leadTextMr; }
    if (!body.sellerId) delete body.sellerId;
    if (form.dataset.photo) body.photo = form.dataset.photo;
    const id = form.dataset.id, err = $('#pfErr');
    err.hidden = true;
    const btn = form.querySelector('[type="submit"]'); btn.disabled = true;
    try {
      const res = id ? await api('PATCH', '/my/products/' + encodeURIComponent(id), body) : await api('POST', '/my/products', body);
      putProduct(res.product);
      closeDrawer();
      toast(id ? t('saved') : (res.product.status === 'active' ? t('productLive', { name: L(res.product.name) }) : t('productPending', { name: L(res.product.name) })));
